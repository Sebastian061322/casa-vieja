/* ============ INVENTARIO: café en kg, insumos de empaque, bolsas listas y costos ============ */
// Todo se calcula a partir de un registro de movimientos (inv_events) que solo se agrega:
// dos personas pueden registrar a la vez sin pisarse, y cualquier movimiento se puede deshacer.
const INV_ROLES = {
  bag: 'Bolsa de café', sticker_front: 'Sticker frontal', sticker_back: 'Sticker trasero', sticker_grind: 'Sticker grano/molido',
  disp_unit: 'Bolsa de despacho unitaria', disp_tripack: 'Bolsa de despacho tripack', disp_prov: 'Bolsa de despacho provincia', other: 'Otro insumo'
};
const INV_SIZED_ROLES = ['bag', 'sticker_front', 'sticker_back'];
const INV_SIZES = [250, 500, 1000];
let invTab = 'cafe';

function normalizeInvItem(i){ return { id:String(i.id), name:String(i.name||''), role:String(i.role||'other'), size:Number(i.size)||0, minStock:Number(i.minStock)||0 }; }
function normalizeInvEvent(e){ return { id:String(e.id), ts:Number(e.ts)||0, date:String(e.date||'').slice(0,10), kind:String(e.kind||''), qty:Number(e.qty)||0, cost:Number(e.cost)||0, loteId:String(e.loteId||''), grind:String(e.grind||''), size:Number(e.size)||0, itemId:String(e.itemId||''), saleId:String(e.saleId||''), batch:String(e.batch||''), note:String(e.note||'') }; }
function mkEvent(kind, f){ return normalizeInvEvent(Object.assign({ id: uid(), ts: Date.now(), date: todayStr(), kind }, f||{})); }

async function syncItems(collection, items){
  if(!items || !items.length) return;
  if(remoteVersion >= 3.1) await syncRemote('upsertItems', { collection, items });
  else for(const it of items) await syncRemote('upsertItem', { collection, item: it });
}
async function syncDeleteItems(collection, ids){
  if(!ids || !ids.length) return;
  if(remoteVersion >= 3.1) await syncRemote('deleteItems', { collection, ids });
  else for(const id of ids) await syncRemote('deleteItem', { collection, id });
}

/* ---- estado derivado ---- */
function invEnabled(){ return (DB.inv_items||[]).length > 0; }
function invEvs(){ return DB.inv_events || []; }
function loteName(id){ const l=(DB.lotes||[]).find(x=>x.id===id); return l ? l.name : 'Sin lote'; }
function invItemById(id){ return (DB.inv_items||[]).find(i=>i.id===id); }
function loteKg(loteId){ return sum(invEvs().filter(e=>e.loteId===loteId && e.kind.indexOf('kg_')===0).map(e=>e.qty)); }
function bagStockMap(){
  const m = {};
  invEvs().forEach(e=>{
    if(e.kind.indexOf('bag_')!==0) return;
    const k = e.loteId+'|'+e.grind+'|'+e.size;
    if(!m[k]) m[k] = { key:k, loteId:e.loteId, grind:e.grind, size:e.size, qty:0 };
    m[k].qty += e.qty;
  });
  return Object.values(m);
}
function bagsReadyTotal(){ return sum(bagStockMap().map(b=>b.qty)); }
function itemStock(id){ return sum(invEvs().filter(e=>e.itemId===id && e.kind.indexOf('sup_')===0).map(e=>e.qty)); }
// Costo unitario = promedio ponderado de tus compras (incluye flete/motorizado si lo pones en el total)
function itemUnitCost(id){
  const evs = invEvs().filter(e=>e.itemId===id && e.kind.indexOf('sup_')===0).sort((a,b)=>(a.ts-b.ts)||a.id.localeCompare(b.id));
  let stock = 0, avg = 0;
  evs.forEach(e=>{
    if(e.kind==='sup_in' && e.qty>0){ avg = stock<=0 ? e.cost/e.qty : (stock*avg + e.cost)/(stock + e.qty); }
    stock += e.qty;
  });
  return avg;
}
function lowSupplyItems(){ return (DB.inv_items||[]).filter(i=>i.minStock>0 && itemStock(i.id)<=i.minStock); }

/* ---- receta de empaque ---- */
function invFindItem(role, size){
  const items = DB.inv_items||[];
  return items.find(i=>i.role===role && Number(i.size)===Number(size)) || items.find(i=>i.role===role && !i.size);
}
function bagPackItems(size){
  const out = [];
  ['bag','sticker_front','sticker_back','sticker_grind'].forEach(r=>{ const it = (r==='sticker_grind') ? invFindItem(r,0) : invFindItem(r,size); if(it) out.push(it); });
  return out;
}
function bagPackMissing(size){
  const missing = [];
  [['bag','Bolsa de café '+size+' g'],['sticker_front','Sticker frontal'],['sticker_back','Sticker trasero'],['sticker_grind','Sticker grano/molido']].forEach(([r,label])=>{
    const it = (r==='sticker_grind') ? invFindItem(r,0) : invFindItem(r,size);
    if(!it) missing.push(label); else if(itemUnitCost(it.id)<=0) missing.push('Sin costo: '+it.name);
  });
  return missing;
}
function bagPackCost(size){ return sum(bagPackItems(size).map(i=>itemUnitCost(i.id))); }
// Provincia usa el costo estándar de la bolsa de despacho (unitaria o tripack); el stock sí se cuenta aparte.
function dispatchCost(kind){ const it = invFindItem(kind==='tripack'?'disp_tripack':'disp_unit',0); return it ? itemUnitCost(it.id) : 0; }
function presentationBagSize(p){ return Math.round((Number(p.weightGrams)||0) / (Number(p.unitsPerSale)||1)); }
function presentationPack(p){
  const bags = Number(p.unitsPerSale)||1, size = presentationBagSize(p);
  const kind = bags>=3 ? 'tripack' : 'unit';
  const missing = bagPackMissing(size);
  const dispIt = invFindItem(kind==='tripack'?'disp_tripack':'disp_unit',0);
  if(!dispIt) missing.push('Bolsa de despacho '+(kind==='tripack'?'tripack':'unitaria')); else if(itemUnitCost(dispIt.id)<=0) missing.push('Sin costo: '+dispIt.name);
  return { size, bags, cost: bags*bagPackCost(size) + dispatchCost(kind), missing };
}
function supplyLimitBags(size){
  const items = bagPackItems(size);
  if(items.length===0) return null;
  return Math.max(0, Math.min(...items.map(i=>Math.floor(itemStock(i.id)))));
}

async function applyPackCosts(){
  const changed = [];
  (DB.products||[]).forEach(p=>{
    if(!(Number(p.weightGrams)>0)) return;
    const info = presentationPack(p);
    if(info.missing.length===0 && Math.abs(info.cost-(Number(p.packagingCost)||0))>=0.01){
      p.packagingCost = Math.round(info.cost*100)/100;
      p.cost = getProductCost(p);
      changed.push(p);
    }
  });
  if(changed.length){ saveDB(false); for(const p of changed) await syncRemote('updateProduct', p); }
  return changed.length;
}
async function maybeAutoApplyPackCosts(){
  if(getSetting('autoPackCost')===false || getSetting('autoPackCost')==='false') return;
  const n = await applyPackCosts();
  if(n>0) showSyncBanner('✓ Costo de empaque actualizado en '+n+' presentación(es)', false);
}

/* ---- ventas: descuento automático ---- */
function invAllocateBags(grind, size, n){
  const stock = bagStockMap().filter(b=>b.grind===grind && b.size===size && b.qty>0);
  const order = (DB.lotes||[]).map(l=>l.id);
  stock.sort((a,b)=>order.indexOf(a.loteId)-order.indexOf(b.loteId));
  const out = []; let rem = n;
  for(const b of stock){ if(rem<=0) break; const take = Math.min(b.qty, rem); out.push({ loteId:b.loteId, qty:take }); rem -= take; }
  if(rem>0){ const fb = (stock[0] && stock[0].loteId) || ((getActiveLote(grind)||{}).id) || ''; out.push({ loteId:fb, qty:rem }); }
  return out;
}
// parts: [{grind,size,n,loteId|null}] ; devuelve los movimientos creados (ya agregados a DB)
function invApplySale(sale, parts, dispatch, packs, bagsPerPack){
  if(!invEnabled()) return [];
  const evs = [];
  parts.forEach(pt=>{
    if(!(pt.size>0) || !(pt.n>0)) return;
    const alloc = (pt.loteId!==null && pt.loteId!==undefined) ? [{ loteId:pt.loteId, qty:pt.n }] : invAllocateBags(pt.grind, pt.size, pt.n);
    alloc.forEach(a=> evs.push(mkEvent('bag_out_sale', { qty:-a.qty, loteId:a.loteId, grind:pt.grind, size:pt.size, saleId:sale.id, date:sale.date })));
  });
  const role = dispatch==='provincia' ? 'disp_prov' : (bagsPerPack>=3 ? 'disp_tripack' : 'disp_unit');
  const it = invFindItem(role,0);
  if(it) evs.push(mkEvent('sup_use_sale', { qty:-(packs||1), itemId:it.id, saleId:sale.id, date:sale.date }));
  DB.inv_events = (DB.inv_events||[]).concat(evs);
  return evs;
}
function invRemoveSaleEvents(saleId){
  const ids = invEvs().filter(e=>e.saleId===saleId).map(e=>e.id);
  if(ids.length) DB.inv_events = DB.inv_events.filter(e=>e.saleId!==saleId);
  return ids;
}

function refreshBaggingPreview(loteId){

async function submitBagging(loteId){
  const size = Number(val('iv-size'))||500, n = parseInt(val('iv-n'))||0, grind = val('iv-grind')||'grano';
  if(n<=0){ alert('Escribe cuántas bolsas hiciste.'); return; }
  const kgUsed = num('iv-kg') || (n*size/1000);
  const warns = [];
  if(loteKg(loteId) - kgUsed < -0.0001) warns.push('Los kilos registrados de este lote no alcanzan.');
  const items = bagPackItems(size);
  items.forEach(i=>{ if(itemStock(i.id) < n) warns.push('Falta stock de '+i.name+' (hay '+itemStock(i.id)+', necesitas '+n+').'); });
  if(warns.length && !confirm(warns.join('\n')+'\n\n¿Registrar de todas formas?')) return;
  const batch = uid(), date = val('iv-date')||todayStr();
  const evs = [
    mkEvent('kg_bagging', { qty:-kgUsed, loteId, grind, size, batch, date }),
    mkEvent('bag_in', { qty:n, loteId, grind, size, batch, date })
  ];
  items.forEach(i=> evs.push(mkEvent('sup_use_bagging', { qty:-n, itemId:i.id, batch, date })));
  await commitInvEvents(evs);
}

/* ---- actividad y deshacer ---- */
function evGroupKey(e){ return e.saleId ? 'sale:'+e.saleId : (e.batch || e.id); }
function describeGroup(g){
  const by = k=>g.filter(e=>e.kind===k);
  const gl = e=> e.grind==='grano' ? 'grano' : 'molido';
  const sg = n=> (n>0?'+':'−')+Math.abs(n);
  if(by('kg_in').length){ const e=by('kg_in')[0]; return 'Saco recibido: +'+e.qty+' kg · '+loteName(e.loteId); }
  if(by('kg_bagging').length){ const k=by('kg_bagging')[0], b=by('bag_in')[0]; return 'Embolsado: '+(b?b.qty:'?')+' bolsas de '+(b?b.size:'?')+' g ('+(b?gl(b):'')+') · '+loteName(k.loteId)+' · −'+Math.abs(k.qty).toFixed(2)+' kg'; }
  if(by('kg_loose').length){ const e=by('kg_loose')[0]; return 'Salida suelta: −'+Math.abs(e.qty)+' kg · '+e.note+' · '+loteName(e.loteId); }
  if(by('kg_adjust').length){ const e=by('kg_adjust')[0]; return 'Conteo de café '+loteName(e.loteId)+': ajuste '+sg(e.qty)+' kg'; }
  if(g.some(e=>e.saleId)){ const bags=sum(by('bag_out_sale').map(e=>-e.qty)); return 'Venta: −'+bags+' bolsas'+(by('sup_use_sale').length?' y bolsa de despacho':''); }
  if(by('bag_loose').length){ const e=by('bag_loose')[0]; return 'Bolsas listas: −'+Math.abs(e.qty)+' ('+e.note+') · '+e.size+' g '+gl(e); }
  if(by('bag_adjust').length){ const e=by('bag_adjust')[0]; return 'Conteo de bolsas '+e.size+' g '+gl(e)+': ajuste '+sg(e.qty); }
  if(by('sup_in').length){ const e=by('sup_in')[0], it=invItemById(e.itemId); return 'Compra: +'+e.qty+' '+(it?it.name:'insumo')+' · '+money(e.cost); }
  if(by('sup_adjust').length){ const e=by('sup_adjust')[0], it=invItemById(e.itemId); return 'Conteo de '+(it?it.name:'insumo')+': ajuste '+sg(e.qty); }
  return 'Movimiento';
}
async function undoInvBatch(key){
  if(!confirm('¿Deshacer este movimiento? Se revierten todos sus efectos.')) return;
  const ids = invEvs().filter(e=>!e.saleId && evGroupKey(e)===key).map(e=>e.id);
  if(!ids.length) return;
  DB.inv_events = DB.inv_events.filter(e=>!ids.includes(e.id));
  saveDB(false); renderInventario();
  await syncDeleteItems('inv_events', ids);
}

/* ============ ACCIONES DE LOTES ============ */
async function addLote(){
  const name = val('lot-name').trim() || ('Lote ' + ((DB.lotes ? DB.lotes.length : 0) + 1));
  const producer = val('lot-producer').trim();
  const variety = val('lot-variety').trim();
  const origin = val('lot-origin').trim();
  const cupScore = num('lot-score');
  const type = val('lot-type') || 'ambos';
  
  const greenKg = num('lot-green-kg');
  const greenCostPerKg = num('lot-green-cost');
  const freightCost = num('lot-freight-cost');
  const roastedKg = num('lot-roasted-kg');
  const roastCost = num('lot-roast-cost');

  if(greenKg <= 0 || roastedKg <= 0) {
    alert('Ingresa cantidades válidas para los kilos de café verde y tostado.');
    return;
  }

  const greenTotalCost = greenKg * greenCostPerKg;
  const totalLotCost = greenTotalCost + roastCost + freightCost;
  const costPerKgRoasted = Math.round((totalLotCost / roastedKg) * 100) / 100;
  const yieldPct = (roastedKg / greenKg) * 100;

  if(!DB.lotes) DB.lotes = [];

  DB.lotes.forEach(l => {
    if(l.active){
      if(type === 'ambos' || l.type === 'ambos' || l.type === type) {
        l.active = false;
      }
    }
  });

  const lote = {
    id: uid(), name, producer, variety, origin, cupScore, type,
    date: todayStr(), greenKg, greenCostPerKg, freightCost,
    roastedKg, roastCost, totalLotCost, costPerKgRoasted, yieldPct,
    active: true
  };

  DB.lotes.push(lote);
  saveDB(false);
  renderConfig();
  await syncRemote('addLote', lote);
}

async function toggleLoteActive(id){
  if(!DB.lotes) return;
  const target = DB.lotes.find(l => l.id === id);
  if(!target) return;

  const willBeActive = !target.active;
  const changed = [];

  DB.lotes.forEach(l => {
    if(willBeActive) {
      if(l.id === id) {
        if(!l.active){ l.active = true; changed.push(l); }
      } else if(target.type === 'ambos' || l.type === 'ambos' || l.type === target.type) {
        if(l.active){ l.active = false; changed.push(l); }
      }
    } else {
      if(l.id === id){ l.active = false; changed.push(l); }
    }
  });

  saveDB(false);
  renderConfig();
  for(const l of changed){ await syncRemote('updateLote', l); }
}

async function deleteLote(id){
  if(!confirm('¿Eliminar este lote? Las ventas pasadas conservarán sus datos registrados.')) return;
  DB.lotes = DB.lotes.filter(l => l.id !== id);
  saveDB(false);
  renderConfig();
  await syncRemote('deleteLote', {id});
}

async function saveEditedLote(id){
  const l = DB.lotes.find(item => item.id === id);
  if(!l) return;

  l.name = val('el-name').trim() || l.name;
  l.producer = val('el-producer').trim();
  l.variety = val('el-variety').trim();
  l.origin = val('el-origin').trim();
  l.cupScore = num('el-score');
  l.type = val('el-type');
  l.greenKg = num('el-green-kg');
  l.greenCostPerKg = num('el-green-cost');
  l.freightCost = num('el-freight-cost');
  l.roastedKg = num('el-roasted-kg');
  l.roastCost = num('el-roast-cost');

  const greenTotalCost = l.greenKg * l.greenCostPerKg;
  l.totalLotCost = greenTotalCost + l.roastCost + l.freightCost;
  l.costPerKgRoasted = l.roastedKg > 0 ? Math.round((l.totalLotCost / l.roastedKg) * 100) / 100 : 0;
  l.yieldPct = l.greenKg > 0 ? (l.roastedKg / l.greenKg) * 100 : 0;

  saveDB(false);
  const y = window.scrollY;
  renderConfig();            // actualiza la tabla de fondo
  editLoteModal(id);         // reabre el modal con los valores ya guardados
  window.scrollTo(0, y);
  flashSaved('el-saved-flag');
  await syncRemote('updateLote', l);
}

function exportBackup(){
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'casa-vieja-backup-' + todayStr() + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function importBackup(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed || !Array.isArray(parsed.products) || !Array.isArray(parsed.sales)){
        alert('El archivo no parece un backup válido de Casa Vieja.');
        return;
      }
      if(confirm('Esto reemplazará todos tus datos actuales por los del backup. ¿Continuar?')){
        DB = Object.assign(defaultDB(), parsed);
        saveDB();
        renderView(currentView);
        alert('Backup restaurado correctamente.');
      }
    }catch(err){
      alert('No se pudo leer el archivo: ' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function resetAll(){
  if(!confirm('¿Seguro que quieres borrar TODOS los datos (productos, lotes, ventas, ads, movimientos)?')) return;
  if(!confirm('Última confirmación: esta acción no se puede deshacer. ¿Borrar todo?')) return;
  DB = defaultDB();
  saveDB();
  renderView('config');
}

/* ============ INICIALIZACIÓN Y AUTO-SINCRONIZACIÓN EN VIVO (BLINDADA CONTRA INTERRUPCIONES) ============ */
// Al redibujar una pantalla tras guardar/editar, conservar la posición de scroll
// (switchView ya hace scroll arriba ANTES de renderizar, así que al navegar sigue empezando arriba).
['renderDashboard','renderVentas','renderStock','renderAds','renderEgresos','renderDelivery','renderClientes','renderFondo','renderInventario','renderConfig'].forEach(name=>{
  const original = window[name];
  window[name] = function(){
    const y = window.scrollY;
    const result = original.apply(this, arguments);
    restoreOpenAccordions();
    window.scrollTo(0, y);
    return result;
  };
});

updateConnBadge();
updateSyncBadge();
switchView('dashboard');

if(isConnected()){
  syncThenRefresh().then(ok => { if(ok) renderView(currentView); });
}

// Rastreamos la última vez que el usuario tocó cualquier campo o control.
// Mientras no hayan pasado unos segundos desde esa interacción, el refresco
// automático NUNCA se ejecuta — así no hay riesgo de que te borre algo que
// estás escribiendo, aunque hagas una pausa breve entre campos.
let lastUserInteraction = Date.now();
['input','change','focusin','pointerdown'].forEach(evt=>{
  document.addEventListener(evt, ()=>{ lastUserInteraction = Date.now(); }, true);
});

const SAFE_REFRESH_VIEWS = ['dashboard', 'delivery', 'stock', 'ads', 'egresos', 'clientes'];
const INTERACTION_QUIET_MS = 15000;

async function tryLiveRefresh(){
  if(!isConnected()) return;
  if(document.visibilityState !== 'visible') return;
  if(hasPendingSync()) return; // hay cambios sin guardar en Sheets: no pisar con datos viejos
  if(Date.now() - lastUserInteraction < INTERACTION_QUIET_MS) return; // el usuario está activo: no interrumpir
  if(document.getElementById('modal-edit-sale') || document.getElementById('inv-modal')) return; // hay un modal de edición abierto

  const isTyping = document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'SELECT' || document.activeElement.tagName === 'TEXTAREA');
  if(isTyping) return;

  if(SAFE_REFRESH_VIEWS.includes(currentView)){
    const ok = await refreshFromRemote();
    if(ok && SAFE_REFRESH_VIEWS.includes(currentView)) {
      renderView(currentView);
    }
  }
}

setInterval(tryLiveRefresh, 15000);
setInterval(() => { if(outbox.length) flushOutbox(); }, 10000); // reintento automático de lo pendiente
window.addEventListener('online', () => flushOutbox());
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible'){ flushOutbox().then(tryLiveRefresh); } });
window.addEventListener('focus', () => { flushOutbox().then(tryLiveRefresh); });
</script>
