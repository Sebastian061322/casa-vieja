<!DOCTYPE html>
<html lang="es">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'">
<meta charset="UTF-8">
<!-- CONFIGURACIÓN DE PWA Y VISTA MÓVIL (IPHONE / PC) -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Casa Vieja">

<title>Casa Vieja · Control de Operaciones</title>

<style>
  :root{
    --bg:#1C1410;
    --surface:#241B15;
    --surface-2:#2E241C;
    --surface-3:#382B20;
    --border:#3D2F24;
    --text:#F2E9DC;
    --text-muted:#A8998A;
    --accent-red:#C1432E;
    --accent-gold:#D4A34A;
    --accent-green:#6B8F5C;
    --accent-blue:#5C7F8F;
    --radius:10px;
    --font-display:'Iowan Old Style','Palatino Linotype',Georgia,serif;
    --font-body:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    padding-bottom:env(safe-area-inset-bottom);
  }
  #app{display:flex;min-height:100vh;}
  
  /* Sidebar */
  .sidebar{
    width:220px;flex-shrink:0;background:var(--surface);
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;padding:20px 0;
  }
  .brand{padding:0 20px 18px 20px;border-bottom:1px solid var(--border);margin-bottom:10px;}
  .brand h1{font-family:var(--font-display);font-size:20px;margin:0 0 2px 0;font-weight:600;letter-spacing:.3px;}
  .brand span{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;}
  nav.navlist{
    display:flex;flex-direction:column;gap:2px;padding:0 10px;
    -webkit-overflow-scrolling:touch;
  }
  .nav-btn{
    display:flex;align-items:center;gap:10px;
    background:none;border:none;color:var(--text-muted);
    padding:10px 12px;border-radius:8px;cursor:pointer;
    font-size:14px;text-align:left;font-family:var(--font-body);
    transition:background .15s, color .15s;
  }
  .nav-btn svg{flex-shrink:0;opacity:.8;}
  .nav-btn:hover{background:var(--surface-2);color:var(--text);}
  .nav-btn.active{background:var(--surface-3);color:var(--text);font-weight:600;}
  .nav-btn.active svg{opacity:1;}
  .sidebar-footer{margin-top:auto;padding:14px 20px 0 20px;border-top:1px solid var(--border);}
  .sidebar-footer p{font-size:11px;color:var(--text-muted);line-height:1.5;margin:10px 0 0 0;}
  #connStatus.online{color:var(--accent-green);}
  #connStatus.offline{color:var(--text-muted);}
  
  /* Main */
  .main{flex:1;min-width:0;padding:26px 34px 60px 34px;}
  .topbar{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px;flex-wrap:wrap;gap:8px;}
  .topbar h2{font-family:var(--font-display);font-size:26px;margin:0;font-weight:600;}
  .topbar .today{font-size:13px;color:var(--text-muted);}
  .view{display:none;}
  .view.active{display:block;animation:fadein .2s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  
  /* Cards / grid */
  .grid{display:grid;gap:14px;}
  .grid-kpi{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:22px;}
  .grid-charts{grid-template-columns:repeat(auto-fit,minmax(320px,1fr));}
  .card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:16px 18px;
  }
  .kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-muted);margin:0 0 8px 0;}
  .kpi-value{font-family:var(--font-display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;margin:0;}
  .kpi-value.red{color:var(--accent-red);}
  .kpi-value.gold{color:var(--accent-gold);}
  .kpi-value.green{color:var(--accent-green);}
  .kpi-sub{font-size:11px;color:var(--text-muted);margin-top:6px;}
  .card h3{font-size:14px;margin:0 0 14px 0;font-weight:600;color:var(--text);}
  .card h3 small{display:block;font-size:11px;color:var(--text-muted);font-weight:400;margin-top:2px;}
  
  /* Chart bits */
  .chart-svg{width:100%;height:auto;display:block;}
  .legend{display:flex;flex-direction:column;gap:6px;margin-top:12px;font-size:12px;}
  .legend-row{display:flex;align-items:center;gap:8px;justify-content:space-between;}
  .legend-left{display:flex;align-items:center;gap:8px;color:var(--text-muted);}
  .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .donut-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap;}
  .donut{width:120px;height:120px;border-radius:50%;position:relative;flex-shrink:0;}
  .donut::after{content:'';position:absolute;inset:22px;background:var(--surface);border-radius:50%;}
  .donut-center{position:absolute;inset:22px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-muted);text-align:center;z-index:2;}
  
  /* Ripeness stock scale */
  .stock-row{margin-bottom:14px;}
  .stock-row-head{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;}
  .stock-row-head b{font-weight:600;}
  .stock-row-head span.low{color:var(--accent-red);font-weight:600;}
  .ripeness-track{position:relative;height:10px;border-radius:6px;overflow:hidden;
    background:linear-gradient(90deg,var(--accent-red) 0%,var(--accent-gold) 45%,var(--accent-green) 100%);}
  .ripeness-mask{position:absolute;top:0;right:0;height:100%;background:var(--surface-2);}
  .ripeness-min{position:absolute;top:-2px;width:2px;height:14px;background:var(--text);opacity:.8;}
  
  /* Forms */
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px;}
  label{display:block;font-size:11px;color:var(--text-muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;}
  input,select{
    width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    padding:9px 10px;border-radius:7px;font-size:13.5px;font-family:var(--font-body);
  }
  input:focus,select:focus{outline:2px solid var(--accent-gold);outline-offset:1px;}
  .btn{
    background:var(--accent-gold);color:#231A12;border:none;padding:10px 16px;
    border-radius:7px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:var(--font-body);
  }
  .btn:hover{filter:brightness(1.08);}
  .btn.secondary{background:var(--surface-3);color:var(--text);border:1px solid var(--border);}
  .btn.danger{background:var(--accent-red);color:#fff;}
  .btn.small{padding:5px 10px;font-size:12px;}
  .btn:focus-visible, .nav-btn:focus-visible, select:focus-visible, input:focus-visible{outline:2px solid var(--accent-gold);outline-offset:2px;}
  
  /* Table */
  .table-wrap{
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
  tr:last-child td{border-bottom:none;}
  .pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
  .pill.green{background:rgba(107,143,92,.18);color:var(--accent-green);}
  .pill.gold{background:rgba(212,163,74,.18);color:var(--accent-gold);}
  .pill.red{background:rgba(193,67,46,.18);color:var(--accent-red);}
  .empty{color:var(--text-muted);font-size:13px;padding:24px 4px;text-align:center;border:1px dashed var(--border);border-radius:var(--radius);}
  .section-title{font-family:var(--font-display);font-size:18px;font-weight:600;margin:26px 0 12px 0;}
  .section-title:first-child{margin-top:0;}
  .row-actions{display:flex;gap:6px;}
  .hint{font-size:11.5px;color:var(--text-muted);margin-top:-4px;margin-bottom:14px;}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .flexend{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;}

  /* Acordeón (tarjetas desplegables para historiales) */
  .acc-list{display:flex;flex-direction:column;gap:8px;}
  .acc-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
  .acc-head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none;}
  .acc-head:hover{background:var(--surface-2);}
  .acc-num{flex:0 0 auto;min-width:26px;color:var(--text-muted);font-size:12px;font-weight:600;}
  .acc-summary{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;}
  .acc-summary .acc-main{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .acc-summary .acc-sub{color:var(--text-muted);font-size:12px;white-space:nowrap;}
  .acc-summary .acc-amt{margin-left:auto;font-weight:700;white-space:nowrap;}
  .acc-caret{flex:0 0 auto;color:var(--text-muted);transition:transform .15s;font-size:12px;}
  .acc-item.open .acc-caret{transform:rotate(180deg);}
  .acc-body{display:none;padding:4px 14px 14px 14px;border-top:1px solid var(--border);}
  .acc-item.open .acc-body{display:block;}
  .acc-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 16px;margin:10px 0;}
  .acc-field label{margin-bottom:2px;}
  .acc-field div{font-size:13.5px;}
  .acc-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .wf-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px;}
  .wf-row small{display:block;color:var(--text-muted);font-size:11px;font-weight:400;}
  .wf-row b{white-space:nowrap;font-variant-numeric:tabular-nums;}
  .wf-row.neg b{color:var(--accent-red);}
  .wf-row.total{border-bottom:none;border-top:2px solid var(--border);margin-top:4px;padding-top:12px;font-size:16px;font-weight:600;}
  .wf-row.total b{font-family:var(--font-display);font-size:24px;}
  .split-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:14px;}
  .split-box{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;}
  .split-box .nm{font-weight:600;margin-bottom:6px;}
  .split-box .ln{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-muted);padding:2px 0;}
  .split-box .tt{display:flex;justify-content:space-between;font-weight:700;padding-top:6px;margin-top:4px;border-top:1px solid var(--border);}
  .acc-item.static .acc-head{cursor:default;}
  .acc-item.static .acc-head:hover{background:none;}
  .acc-field input,.acc-field select{width:100%;}
  .pill.blue{background:rgba(92,127,143,.18);color:var(--accent-blue);}
  .acc-list + .acc-list{margin-top:8px;}
  @media (max-width:880px){
    .acc-summary .acc-main{max-width:140px;}
  }

  /* Botón hamburguesa (solo visible en móvil) */
  .hamburger-btn{
    display:none;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    width:40px;height:40px;border-radius:8px;cursor:pointer;flex-shrink:0;
    align-items:center;justify-content:center;
  }

  /* ADAPTACIÓN MÓVIL (IPHONE / SMARTPHONES) */
  @media (max-width:880px){
    #app{flex-direction:column;}
    .sidebar{
      width:100%;flex-direction:column;align-items:stretch;position:relative;z-index:500;
      padding: max(12px, env(safe-area-inset-top)) 14px 12px 14px;
    }
    .brand{border:none;padding:0;margin:0;display:flex;align-items:center;justify-content:space-between;}
    .hamburger-btn{display:flex;}
    nav.navlist{
      flex-direction:column;padding:0;margin-top:0;max-height:0;overflow:hidden;
      transition:max-height .2s ease, margin-top .2s ease;
    }
    nav.navlist.open{max-height:480px;margin-top:12px;}
    .sidebar-footer{display:none;}
    .main{padding:16px 16px 50px 16px;}
    
    input, select, textarea {
      font-size: 16px !important;
    }
    
    .btn, .nav-btn {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
    }
    .btn{justify-content:center;}
    .nav-btn{justify-content:flex-start;}
  }
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <div>
        <h1>Casa Vieja</h1>
        <span>Control de operaciones</span>
      </div>
      <button class="hamburger-btn" id="hamburgerBtn" onclick="toggleMobileNav()" aria-label="Abrir menú">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
      </button>
    </div>
    <nav class="navlist" id="navlist">
      <button class="nav-btn" data-view="dashboard" onclick="switchView('dashboard')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="12" width="4" height="9"/><rect x="10" y="6" width="4" height="15"/><rect x="17" y="3" width="4" height="18"/></svg>
        Dashboard
      </button>
      <button class="nav-btn" data-view="ventas" onclick="switchView('ventas')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/><path d="M2 3h2l2.6 12.6a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.6L21 7H5.2"/></svg>
        Ventas
      </button>
      <button class="nav-btn" data-view="stock" onclick="switchView('stock')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
        Stock
      </button>
      <button class="nav-btn" data-view="ads" onclick="switchView('ads')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11v2a1 1 0 0 0 1 1h3l5 4V6L7 10H4a1 1 0 0 0-1 1z"/><path d="M16 8a4 4 0 0 1 0 8"/></svg>
        Ads
      </button>
      <button class="nav-btn" data-view="egresos" onclick="switchView('egresos')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7h18v13H3z"/><path d="M3 7l4-4h10l4 4"/><path d="M8 12h8"/></svg>
        Egresos
      </button>
      <button class="nav-btn" data-view="delivery" onclick="switchView('delivery')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="1" y="7" width="13" height="9"/><path d="M14 10h4l3 3v3h-7z"/><circle cx="5.5" cy="18" r="1.6"/><circle cx="16.5" cy="18" r="1.6"/></svg>
        Delivery
      </button>
      <button class="nav-btn" data-view="clientes" onclick="switchView('clientes')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17.5" cy="9" r="2.4"/><path d="M15.5 14.2c2.6.3 4.5 2.5 4.5 5.3"/></svg>
        Clientes
      </button>
      <button class="nav-btn" data-view="inventario" onclick="switchView('inventario')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>
        Inventario
      </button>
      <button class="nav-btn" data-view="fondo" onclick="switchView('fondo')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>
        Fondo
      </button>
      <button class="nav-btn" data-view="config" onclick="switchView('config')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
        Configuración
      </button>
    </nav>
    <div class="sidebar-footer">
      <p id="connStatus">● Modo local — solo en este navegador</p>
      <p>Haz backup seguido desde Configuración.</p>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h2 id="pageTitle">Dashboard</h2>
      <div class="today" id="todayLabel"></div>
    </div>
    <section class="view" id="view-dashboard"></section>
    <section class="view" id="view-ventas"></section>
    <section class="view" id="view-stock"></section>
    <section class="view" id="view-ads"></section>
    <section class="view" id="view-egresos"></section>
    <section class="view" id="view-delivery"></section>
    <section class="view" id="view-clientes"></section>
    <section class="view" id="view-inventario"></section>
    <section class="view" id="view-fondo"></section>
    <section class="view" id="view-config"></section>
  </main>
</div>

<script>
/* ============ CONSTANTES GLOBALES Y DICCIONARIOS ============ */
const STORE_KEY='cv-original-synthetic-5a';
const CONN_KEY='cv-original-no-connection-5a';

const TITLES = {
  dashboard: 'Dashboard',
  ventas: 'Ventas',
  stock: 'Stock',
  ads: 'Ads',
  egresos: 'Egresos',
  delivery: 'Delivery',
  clientes: 'Clientes',
  inventario: 'Inventario',
  fondo: 'Fondo del negocio',
  config: 'Configuración'
};

const MONTH_NAMES = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
const FULL_MONTH_NAMES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

const CHANNELS = [
  'Meta Ads (Facebook/Instagram)',
  'WhatsApp Directo',
  'Recomendación / Orgánico',
  'Feria / Evento',
  'Otro'
];

const PAYMENT_STATUSES = ['Pendiente', 'Pagado', 'Cancelado'];
const DELIVERY_STATUSES = ['Pendiente', 'En camino', 'Entregado'];

// Gastos de operación: SÍ restan de la utilidad.
const OPEX_CATEGORIES = ['Sueldos', 'Alquiler / servicios', 'Herramientas / Insumos', 'Otros'];
// Insumos de producción: ya van dentro del costo del producto, NO restan otra vez de la utilidad.
const INSUMO_CATEGORIES = ['Empaques y bolsas', 'Etiquetas y diseño', 'Tostado / Maquila', 'Flete / Transporte'];
const EXPENSE_CATEGORIES = [...OPEX_CATEGORIES, ...INSUMO_CATEGORIES];

const COLORS = {
  bg: '#1C1410',
  surface: '#241B15',
  surface2: '#2E241C',
  surface3: '#382B20',
  border: '#3D2F24',
  text: '#F2E9DC',
  muted: '#A8998A',
  red: '#C1432E',
  gold: '#D4A34A',
  green: '#6B8F5C',
  blue: '#5C7F8F'
};

function getConnConfig() {

  } catch (e) {}

  // Retrocompatibilidad si estaba guardado en llaves sueltas

async function fetchJSON(url, opts, timeoutMs) {
  const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  const timer = ctrl ? setTimeout(() => ctrl.abort(), timeoutMs) : null;
  let text;
  try {
    const res = await fetch(url, Object.assign({}, opts, ctrl ? { signal: ctrl.signal } : {}));
    text = await res.text();
  } catch (e) {
    throw new Error(e && e.name === 'AbortError' ? 'Tiempo agotado (el servidor tardó demasiado)' : 'Sin conexión con tu Apps Script (' + ((e && e.message) || e) + ')');
  } finally { if (timer) clearTimeout(timer); }
  try { return JSON.parse(text); }
  catch (e) { throw new Error('Respuesta no válida: no es de tu Apps Script (revisa la URL y que el despliegue sea "Cualquier usuario"). Empieza con: ' + String(text).slice(0, 60).replace(/\s+/g, ' ')); }
}

async function apiGet() {
  const c = getConnConfig();
  if (!c.url) return null;
  const url = c.url + (c.url.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(c.token) + '&_t=' + Date.now();
  return fetchJSON(url, {}, 45000);
}

async function apiPost(action, payload) {
  const c = getConnConfig();
  if (!c.url) return null;
  return fetchJSON(c.url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ token: c.token, action, payload })
  }, 60000);
}

let remoteVersion = 2;

/* ============ COLA DE GUARDADO: nada se pierde si Sheets falla ============ */
// Cada cambio se guarda primero en este dispositivo y se envía a Sheets desde una cola persistente.
// Si falla (sin internet, servidor ocupado, script desactualizado) se reintenta solo y NUNCA se
// reemplaza lo local con lo de Sheets mientras haya cambios pendientes.
const OUTBOX_KEY = 'casa_vieja_outbox', FAILED_KEY = 'casa_vieja_failed_ops';
function readLS(key){ try { return JSON.parse(localStorage.getItem(key)) || []; } catch(e){ return []; } }
let outbox = readLS(OUTBOX_KEY);
let failedOps = readLS(FAILED_KEY);
let flushing = false;
let lastSyncError = '';
const TRANSIENT_RE = /ocupado|token|conexi|failed to fetch|network|tiempo|abort|respuesta|sin respuesta/i;

function persistOutbox(){
  try { localStorage.setItem(OUTBOX_KEY, JSON.stringify(outbox)); localStorage.setItem(FAILED_KEY, JSON.stringify(failedOps)); }
  catch(e){ console.warn('No se pudo guardar la cola de sincronización', e); }
}
function hasPendingSync(){ return outbox.length > 0 || flushing; }

function hintForError(e){
  e = String(e || '');
  if(/50000/.test(e)) return 'Tu Apps Script es una versión vieja que guardaba todo en una sola celda. Pega la v3.2 y crea una Nueva versión del despliegue.';
  if(/token/i.test(e)) return 'El token no coincide con el del script (TOKEN_SECRETO). Revísalo en Configuración.';
  if(/ocupado/i.test(e)) return 'Otra persona estaba guardando. Se reintenta solo.';
  if(/respuesta no válida/i.test(e)) return 'La URL no responde con datos de tu script. Revisa en Implementar → Administrar implementaciones: Ejecutar como "Yo" y Quién tiene acceso "Cualquier usuario". Usa la URL que termina en /exec.';
  if(/sin conexi|tiempo agotado/i.test(e)) return 'No hay internet o el script tardó demasiado. Se reintenta solo.';
  if(/desconocida/i.test(e)) return 'Tu script está desactualizado: pega la v3.2 y crea una Nueva versión.';
  return 'Si se repite, pega la v3.2 del Apps Script y crea una Nueva versión del despliegue.';
}

function updateSyncBadge(){
  let pill = qs('sync-pill');
  if(!isConnected()){ if(pill) pill.style.display = 'none'; return; }
  if(!pill){
    pill = document.createElement('div');
    pill.id = 'sync-pill';
    pill.onclick = () => openSyncModal();
    pill.style.cssText = 'position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:9000;padding:7px 13px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.4);color:#fff;';
    document.body.appendChild(pill);
  }

  const n = outbox.length;
  if(n === 0){ pill.textContent = '✓ Guardado en Sheets'; pill.style.background = 'rgba(107,143,92,.92)'; pill.style.color = '#fff'; }
  else if(lastSyncError){ pill.textContent = '⚠ ' + n + ' sin guardar en Sheets — toca para ver'; pill.style.background = 'var(--accent-red)'; pill.style.color = '#fff'; }
  else { pill.textContent = '⏳ Guardando… (' + n + ')'; pill.style.background = 'var(--accent-gold)'; pill.style.color = '#231A12'; }
}

async function flushOutbox(){
  if(flushing || !isConnected()) return;
  if(!outbox.length){ updateSyncBadge(); return; }
  flushing = true; updateSyncBadge();
  try {
    while(outbox.length){
      const op = outbox[0];
      let res = null, err = '';
      try { res = await apiPost(op.action, op.payload); }
      catch(e){ err = (e && e.message) || String(e); }
      if(!err && res && res.error) err = res.error;
      if(!err && !res) err = 'Sin respuesta del servidor';
      if(err){
        op.tries = (op.tries || 0) + 1; op.lastError = err; lastSyncError = err;
        if(op.tries >= 8 && !TRANSIENT_RE.test(err)){ failedOps.push(outbox.shift()); persistOutbox(); continue; }
        persistOutbox();
        return;
      }
      outbox.shift(); lastSyncError = ''; persistOutbox(); updateSyncBadge();
    }
  } finally { flushing = false; updateSyncBadge(); }
}

async function syncThenRefresh(){
  await flushOutbox();
  if(hasPendingSync()){
    showSyncBanner('Hay ' + outbox.length + ' cambio(s) sin guardar en Sheets. Se conservan en este dispositivo y se reintentan solos.', true);
    return false;
  }
  return refreshFromRemote();
}

  document.body.insertAdjacentHTML('beforeend', `<div id="sync-modal" style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:9999;">

      ${lastSyncError ? `<div style="background:rgba(193,67,46,.12);border-left:4px solid var(--accent-red);padding:8px 12px;margin:10px 0;border-radius:4px;font-size:13px;"><b>${esc(lastSyncError)}</b><br><span style="opacity:.9">${esc(hintForError(lastSyncError))}</span></div>` : ''}
      ${failedOps.length ? `<div class="hint">Hay ${failedOps.length} cambio(s) que el script rechazó. <a href="#" onclick="retryFailedOps();return false;" style="color:var(--accent-gold)">Reintentar</a></div>` : ''}
      <div id="sync-diag" style="margin:10px 0;font-size:13px;"></div>

        <button class="btn small secondary" onclick="closeSyncModal()">Cerrar</button>
      </div>
    </div></div>`);
  if(runDiag) runDiagnostics();
}
function retryFailedOps(){ outbox = failedOps.concat(outbox); failedOps = []; persistOutbox(); flushOutbox().then(()=>openSyncModal()); }
function discardOutbox(){
  if(!confirm('¿Descartar los cambios pendientes? Quedarán solo en este dispositivo y NO llegarán a Sheets.')) return;
  outbox = []; lastSyncError = ''; persistOutbox(); updateSyncBadge(); openSyncModal();
}
async function runDiagnostics(){
  const out = qs('sync-diag'); if(!out) return;
  out.innerHTML = 'Probando…';
  const lines = [];
  try {
    const g = await apiGet();
    if(g && g.error) lines.push('✗ Lectura: ' + g.error);
    else {
      lines.push('✓ Lectura correcta · versión del script: ' + (g.version || '2 o anterior') + ' · ' + ((g.sales||[]).length) + ' ventas en Sheets');
      if(!(Number(g.version) >= 3.2)) lines.push('⚠ Tu script no es la v3.2: puede guardar lento o fallar. Pega la v3.2 y crea una Nueva versión.');
    }
  } catch(e){ lines.push('✗ Lectura: ' + e.message); }
  try { const r = await apiPost('ping', {}); lines.push(r && r.error ? '✗ Escritura: ' + r.error : '✓ Escritura: el script responde'); }
  catch(e){ lines.push('✗ Escritura: ' + e.message); }
  lines.push(outbox.length ? '⏳ Pendientes en este dispositivo: ' + outbox.length : '✓ No hay cambios pendientes');
  out.innerHTML = lines.map(l => '<div style="padding:2px 0;">' + esc(l) + '</div>').join('');
}

async function syncRemote(action, payload) {
  if (!isConnected()) return { ok: true, local: true };
  outbox.push({ id: uid(), action, payload, ts: Date.now(), tries: 0, lastError: '' });
  persistOutbox();
  updateSyncBadge();
  flushOutbox(); // sin esperar: la pantalla no se bloquea
  return { ok: true, queued: true };
}

async function refreshFromRemote() {
  if (!isConnected()) return false;
  if (hasPendingSync()) return false; // nunca reemplazar lo local mientras haya cambios sin guardar en Sheets
  try {
    const data = await apiGet();
    if (!data || data.error) { console.error('Error de Sheets:', data && data.error); return false; }
    const source = data.db || data;
    remoteVersion = Number(data.version) || 2;
    DB = {
      products: (source.products || []).map(normalizeProduct),
      sales: (source.sales || []).map(normalizeSale),
      movements: source.movements || [],
      ads: (source.ads || []).map(normalizeAd),
      expenses: (source.expenses || []).map(normalizeExpense),
      lotes: (source.lotes || []).map(normalizeLote),
      baseProducts: (source.baseProducts || []).map(normalizeBaseProduct),
      // Con el Apps Script v3 los ajustes y el fondo vienen de Sheets; con el v2 se quedan en este dispositivo.
      settings: (remoteVersion>=3 && source.settings && typeof source.settings==='object') ? source.settings : (DB.settings||{}),
      fund: (remoteVersion>=3 && Array.isArray(source.fund)) ? source.fund.map(normalizeFund) : (DB.fund||[]),
      inv_items: (remoteVersion>=3 && Array.isArray(source.inv_items)) ? source.inv_items.map(normalizeInvItem) : (DB.inv_items||[]),
      inv_events: (remoteVersion>=3 && Array.isArray(source.inv_events)) ? source.inv_events.map(normalizeInvEvent) : (DB.inv_events||[])
    };
    localStorage.setItem(STORE_KEY, JSON.stringify(DB));
    return true;
  } catch (e) {
    console.error("Error al descargar de Google Sheets:", e);
    return false;
  }
}

async function connectSheets() {
  const url = val('cfg-url').trim();
  const token = val('cfg-token').trim();
  if (!url || !token) { alert('Completa la URL y el token.'); return; }
  saveConnConfig({ url, token });
  qs('cfg-conn-status').textContent = 'Probando conexión…';
  try {
    const data = await apiGet();
    if (!data || data.error) {
      qs('cfg-conn-status').textContent = '✗ ' + (data && data.error ? data.error : 'No se pudo conectar.');
      return;
    }
    qs('cfg-conn-status').textContent = '✓ Conectado. Trayendo datos de Sheets…';
    await refreshFromRemote();
    updateConnBadge();
    renderConfig();
    alert('Conectado a Google Sheets con éxito.');
  } catch (e) {
    qs('cfg-conn-status').textContent = '✗ ' + e.message;
  }
}

function disconnectSheets() {
  if (!confirm('¿Volver a modo local? Dejarás de sincronizar con Google Sheets.')) return;
  saveConnConfig({ url: '', token: '' });
  updateConnBadge();

}

/* ============ HELPERS ============ */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function qs(id) { return document.getElementById(id); }
function val(id) { const el = qs(id); return el ? el.value : ''; }
function num(id) { const v = parseFloat(val(id)); return isNaN(v) ? 0 : v; }
function sum(arr) { return arr.reduce((a, b) => a + (Number(b) || 0), 0); }
function todayStr() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function localISODate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function monthKey(dateStr) { return (dateStr || '').slice(0, 7); }
function money(n) { return 'S/ ' + (Number(n) || 0).toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtDate(d) {
  if (!d) return '—';
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('es-PE', { day: '2-digit', month: 'short', year: 'numeric' });
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function productById(id) { return DB.products.find(p => p.id === id); }
function baseProductById(id) { return DB.baseProducts.find(b => b.id === id); }

function getAvailableUnits(product) {
  if (product.baseProductId) {
    const base = baseProductById(product.baseProductId);
    if (!base) return 0;
    const units = product.unitsPerSale || 1;
    return Math.floor(base.stock / units);
  }
  return product.stock;
}

function movementTargets() {
  const targets = DB.baseProducts.map(b => ({ id: b.id, kind: 'base', label: b.name + ' — bolsas físicas' }));
  DB.products.filter(p => !p.baseProductId).forEach(p => { targets.push({ id: p.id, kind: 'product', label: p.name + ' (stock propio, sin vincular)' }); });
  return targets;
}

async function saveSettings(obj){
  DB.settings = Object.assign({}, DB.settings||{}, obj);
  saveDB(false);
  for(const k of Object.keys(obj)){ await syncRemote('setSetting', { key:k, value:obj[k] }); }
}

/* ============ FONDO DEL NEGOCIO (reinversión / ahorro) ============ */
function fundActive(){ return !!(DB.settings && DB.settings.fundStartMonth); }

// Aporte al fondo de un mes: % de los sueldos + % de la utilidad (solo si es positiva).
function fundForMonth(mk, sueldosMonth, utilidadMonth){
  if(!fundActive() || mk < DB.settings.fundStartMonth) return { aporteSueldos:0, aporteUtilidad:0, total:0 };
  const aporteSueldos = sueldosMonth * (Number(getSetting('fundPctSueldo'))||0) / 100;
  const aporteUtilidad = Math.max(utilidadMonth,0) * (Number(getSetting('fundPctUtilidad'))||0) / 100;
  return { aporteSueldos, aporteUtilidad, total: aporteSueldos + aporteUtilidad };
}

// Resumen financiero de un mes (el mismo cálculo del dashboard, reutilizable)
function monthFinance(mk){
  const sales = DB.sales.filter(s=>monthKey(s.date)===mk);
  const ads = DB.ads.filter(a=>monthKey(a.date)===mk);
  const exps = DB.expenses.filter(x=>monthKey(x.date)===mk);
  const rev = sum(sales.map(s=>s.total));
  const profit = sum(sales.map(s=>s.profit));
  const adSpend = sum(ads.map(a=>a.amount));
  const sueldos = sum(exps.filter(x=>x.category==='Sueldos').map(x=>x.amount));
  const opex = sum(exps.filter(x=>OPEX_CATEGORIES.includes(x.category) && x.category!=='Sueldos').map(x=>x.amount));
  const utilidad = profit - adSpend - sueldos - opex;
  return { mk, rev, profit, adSpend, sueldos, opex, utilidad, hasData: (sales.length+ads.length+exps.length)>0, fund: fundForMonth(mk, sueldos, utilidad) };
}

function prevMonthKey(mk){
  const [y,m] = mk.split('-').map(Number);
  const d = new Date(y, m-2, 1);
  return localISODate(d).slice(0,7);
}

function fundMonthsRange(){
  if(!fundActive()) return [];
  const out = []; let mk = DB.settings.fundStartMonth; const end = monthKey(todayStr());
  let guard = 0;
  while(mk <= end && guard++ < 240){ out.push(mk); const [y,m]=mk.split('-').map(Number); mk = localISODate(new Date(y,m,1)).slice(0,7); }
  return out;
}

function fundSummary(){
  const months = fundMonthsRange().map(mk=>monthFinance(mk));
  const aportes = sum(months.map(m=>m.fund.total));
  const usos = sum((DB.fund||[]).map(f=>f.amount));
  const balance = aportes - usos;
  // meta = N meses de gasto (Ads + sueldos + gastos de operación), promedio de los últimos 3 meses con datos
  const recent = []; let mk = monthKey(todayStr());
  for(let i=0;i<3;i++){ const f = monthFinance(mk); if((f.adSpend+f.sueldos+f.opex)>0) recent.push(f); mk = prevMonthKey(mk); }
  const burn = recent.length ? sum(recent.map(f=>f.adSpend+f.sueldos+f.opex))/recent.length : 0;
  const target = burn * (Number(getSetting('fundMonthsTarget'))||3);
  const last3 = months.slice(-3);
  const pace = last3.length ? sum(last3.map(m=>m.fund.total))/last3.length : 0;
  return { months, aportes, usos, balance, burn, target, pace };
}

/* ============ NAVEGACIÓN ============ */
function toggleMobileNav(force){
  const nav = qs('navlist');
  if(!nav) return;
  const open = (typeof force === 'boolean') ? force : !nav.classList.contains('open');
  nav.classList.toggle('open', open);
}

function switchView(name){
  toggleMobileNav(false);
  openAccIds.clear();
  window.scrollTo(0,0);
  currentView = name;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  qs('view-'+name).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.view===name));
  qs('pageTitle').textContent = TITLES[name] || name;
  renderView(name);
}

function renderView(name){
  if(name==='dashboard') renderDashboard();
  else if(name==='ventas') renderVentas();
  else if(name==='stock') renderStock();
  else if(name==='ads') renderAds();
  else if(name==='egresos') renderEgresos();
  else if(name==='delivery') renderDelivery();
  else if(name==='clientes') renderClientes();
  else if(name==='inventario') renderInventario();
  else if(name==='fondo') renderFondo();
  else if(name==='config') renderConfig();
}

/* ============ CHART HELPERS ============ */
function svgBars(values, labels, color, opts){
  opts = opts||{};
  const w = opts.w||560, h = opts.h||190, padL=8, padR=8, padT=10, padB=24;
  const plotW = w-padL-padR, plotH = h-padT-padB;
  const max = Math.max(1, ...values.map(v=>Math.abs(v)));
  const n = values.length || 1;
  const slot = plotW/n;
  const barW = Math.max(4, slot*0.55);
  let bars='', labelsSvg='';
  values.forEach((v,i)=>{
    const bh = max ? (Math.abs(v)/max)*plotH : 0;
    const x = padL + i*slot + (slot-barW)/2;
    const y = padT + (plotH-bh);
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(bh,1).toFixed(1)}" rx="2.5" fill="${color}"><title>${esc(labels[i])}: ${v.toFixed ? v.toFixed(2) : v}</title></rect>`;
    if(labels[i]!==undefined){
      labelsSvg += `<text x="${(x+barW/2).toFixed(1)}" y="${h-8}" font-size="9" fill="${COLORS.muted}" text-anchor="middle">${esc(labels[i])}</text>`;
    }
  });
  return `<svg viewBox="0 0 ${w} ${h}" class="chart-svg" preserveAspectRatio="xMidYMid meet">
    <line x1="${padL}" y1="${padT+plotH}" x2="${w-padR}" y2="${padT+plotH}" stroke="${COLORS.surface2}" stroke-width="1"/>
    ${bars}${labelsSvg}
  </svg>`;
}

function svgGroupedBars(labelsX, seriesA, seriesB, colorA, colorB){
  const w=560, h=200, padL=8, padR=8, padT=10, padB=24;
  const plotW=w-padL-padR, plotH=h-padT-padB;
  const max = Math.max(1, ...seriesA, ...seriesB);
  const n = labelsX.length || 1;
  const slot = plotW/n;
  const barW = Math.max(3, slot*0.32);
  let bars='', labelsSvg='';
  labelsX.forEach((lab,i)=>{
    const va = seriesA[i]||0, vb = seriesB[i]||0;
    const ha = (va/max)*plotH, hb=(vb/max)*plotH;
    const groupX = padL + i*slot + slot*0.14;
    const xa = groupX, xb = groupX+barW+3;
    bars += `<rect x="${xa.toFixed(1)}" y="${(padT+plotH-ha).toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(ha,1).toFixed(1)}" rx="2" fill="${colorA}"><title>${esc(lab)}: ${money(va)}</title></rect>`;
    bars += `<rect x="${xb.toFixed(1)}" y="${(padT+plotH-hb).toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(hb,1).toFixed(1)}" rx="2" fill="${colorB}"><title>${esc(lab)}: ${money(vb)}</title></rect>`;
    labelsSvg += `<text x="${(groupX+barW).toFixed(1)}" y="${h-8}" font-size="9" fill="${COLORS.muted}" text-anchor="middle">${esc(lab)}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" class="chart-svg" preserveAspectRatio="xMidYMid meet">
    <line x1="${padL}" y1="${padT+plotH}" x2="${w-padR}" y2="${padT+plotH}" stroke="${COLORS.surface2}" stroke-width="1"/>
    ${bars}${labelsSvg}
  </svg>`;
}

function donutBlock(entries, opts){
  opts = opts || {};
  const total = sum(entries.map(e=>e[1]));
  const palette = [COLORS.gold, COLORS.red, COLORS.green, COLORS.blue, '#8A6D5C', '#B0895A'];
  if(total<=0 || entries.length===0){
    return `<div class="empty">Sin datos este mes todavía.</div>`;
  }
  let acc=0; const stops=[]; const legendRows=[];
  entries.slice(0,6).forEach((e,i)=>{
    const pct = e[1]/total*100;
    const color = palette[i%palette.length];
    stops.push(`${color} ${acc.toFixed(2)}% ${(acc+pct).toFixed(2)}%`);
    legendRows.push(`<div class="legend-row"><span class="legend-left"><span class="dot" style="background:${color}"></span>${esc(e[0])}</span><span>${opts.money ? money(e[1]) : e[1]} · ${pct.toFixed(0)}%</span></div>`);
    acc += pct;
  });
  return `<div class="donut-wrap">
    <div class="donut" style="background:conic-gradient(${stops.join(',')})">
      <div class="donut-center">${opts.money ? money(total) : total}</div>
    </div>
    <div class="legend" style="flex:1;min-width:160px;">${legendRows.join('')}</div>
  </div>`;
}

/* ============ DASHBOARD (con selector de mes) ============ */
function availableDashboardMonths(){
  const set = new Set();
  DB.sales.forEach(s=>{ const mk=monthKey(s.date); if(mk) set.add(mk); });
  DB.ads.forEach(a=>{ const mk=monthKey(a.date); if(mk) set.add(mk); });
  DB.expenses.forEach(x=>{ const mk=monthKey(x.date); if(mk) set.add(mk); });
  set.add(monthKey(todayStr()));
  return Array.from(set).sort((a,b)=> b.localeCompare(a));
}

function computeDashboardForMonth(thisMonth){
  const today = todayStr();
  const isCurrentMonth = thisMonth === monthKey(today);
  const todaySales = DB.sales.filter(s=>s.date===today);
  const monthSales = DB.sales.filter(s=>monthKey(s.date)===thisMonth);
  const monthAds = DB.ads.filter(a=>monthKey(a.date)===thisMonth);
  const monthExpenses = DB.expenses.filter(x=>monthKey(x.date)===thisMonth);
  const revToday = sum(todaySales.map(s=>s.total));
  const revMonth = sum(monthSales.map(s=>s.total));
  const salesCountMonth = monthSales.length;
  const avgTicketMonth = salesCountMonth>0 ? revMonth/salesCountMonth : 0;
  const profitMonth = sum(monthSales.map(s=>s.profit));
  const expensesMonth = sum(monthExpenses.map(x=>x.amount));
  const netProfitMonth = profitMonth - expensesMonth;
  const adSpendMonth = sum(monthAds.map(a=>a.amount));
  const profitMonthMinusAds = profitMonth - adSpendMonth;
  const adsRevenue = sum(monthSales.filter(s=>s.channel===CHANNELS[0]).map(s=>s.total));
  const sueldosList = monthExpenses.filter(x=>x.category==='Sueldos');
  const sueldosMonth = sum(sueldosList.map(x=>x.amount));
  const opexOtherMonth = sum(monthExpenses.filter(x=>OPEX_CATEGORIES.includes(x.category) && x.category!=='Sueldos').map(x=>x.amount));
  const insumosMonth = sum(monthExpenses.filter(x=>!OPEX_CATEGORIES.includes(x.category)).map(x=>x.amount));
  const utilidadMonth = profitMonthMinusAds - sueldosMonth - opexOtherMonth;
  const fundM = fundForMonth(thisMonth, sueldosMonth, utilidadMonth);
  const invOn = invEnabled();
  const lowSupplies = invOn ? lowSupplyItems() : [];
  const bagsReady = invOn ? bagsReadyTotal() : 0;
  const prevFin = monthFinance(prevMonthKey(thisMonth));
  const sueldoByPartner = {};
  sueldosList.forEach(x=>{ const n = String(x.provider||'').trim() || 'Sin nombre'; sueldoByPartner[n] = (sueldoByPartner[n]||0) + x.amount; });
  const partnerSueldos = Object.entries(sueldoByPartner).map(([name,amount])=>({name,amount}));
  const metaSalesCount = monthSales.filter(s=>s.channel===CHANNELS[0]).length;
  const messagesMonth = sum(monthAds.map(a=>a.messages));
  const costPerMessage = messagesMonth>0 ? adSpendMonth/messagesMonth : null;
  const costPerAdSale = metaSalesCount>0 ? adSpendMonth/metaSalesCount : null;
  const msgToSalePct = messagesMonth>0 ? (metaSalesCount/messagesMonth*100) : null;
  const roas = adSpendMonth>0 ? (adsRevenue/adSpendMonth) : null;
  const totalStock = DB.baseProducts.length>0 ? sum(DB.baseProducts.map(b=>b.stock)) : sum(DB.products.map(p=>p.stock));
  const pendingDeliveries = DB.sales.filter(s=>s.deliveryStatus && s.deliveryStatus!=='Entregado').length;
  const lowStock = DB.baseProducts.length>0 ? DB.baseProducts.filter(b=>b.stock<=b.minStock) : DB.products.filter(p=>p.stock<=p.minStock);
  const byChannel = {};
  monthSales.forEach(s=>{ const ch = s.channel||'Otro'; byChannel[ch]=(byChannel[ch]||0)+s.total; });
  const topChannel = Object.entries(byChannel).sort((a,b)=>b[1]-a[1])[0] || null;
  return {invOn, lowSupplies, bagsReady, fundM, prevFin, sueldosMonth, opexOtherMonth, insumosMonth, utilidadMonth, partnerSueldos, metaSalesCount, messagesMonth, costPerMessage, costPerAdSale, msgToSalePct, isCurrentMonth, revToday, revMonth, salesCountMonth, avgTicketMonth, profitMonth, expensesMonth, netProfitMonth, profitMonthMinusAds, adSpendMonth, roas, totalStock, pendingDeliveries, lowStock, monthSales, topChannel};
}

function thisMonthActive(mk){ return fundActive() && mk >= DB.settings.fundStartMonth; }

function changeDashboardMonth(mk){
  selectedDashboardMonth = mk;
  renderDashboard();
}

function last14DaysSeries(){
  const days=[]; for(let i=13;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push(localISODate(d)); }
  const labels = days.map(d=> d.slice(8,10)+'/'+d.slice(5,7) );
  const values = days.map(d=> sum(DB.sales.filter(s=>s.date===d).map(s=>s.total)) );
  return {labels, values};
}

function last6MonthsSeries(){
  const months=[]; const now=new Date();
  for(let i=5;i>=0;i--){ const d=new Date(now.getFullYear(), now.getMonth()-i, 1); months.push(localISODate(d).slice(0,7)); }
  const labels = months.map(m=> MONTH_NAMES[Number(m.split('-')[1])-1] );
  const profit = months.map(m=> sum(DB.sales.filter(s=>monthKey(s.date)===m).map(s=>s.profit)) );
  const adspend = months.map(m=> sum(DB.ads.filter(a=>monthKey(a.date)===m).map(a=>a.amount)) );
  return {labels, profit, adspend};
}

function productSalesShareForMonth(thisMonth){
  const monthSales = DB.sales.filter(s=>monthKey(s.date)===thisMonth);
  const map={};
  monthSales.forEach(s=>{ map[s.productName]=(map[s.productName]||0)+s.total; });
  return Object.entries(map).sort((a,b)=>b[1]-a[1]);
}

function stockRipenessHTML(){
  const items = DB.baseProducts.length>0
    ? DB.baseProducts.map(b=>({ name:b.name, stock:b.stock, minStock:b.minStock, unit:'bolsas' }))
    : DB.products.map(p=>({ name:p.name, stock:p.stock, minStock:p.minStock, unit:'u.' }));
  if(items.length===0) return `<div class="empty">Agrega tu stock físico en Configuración para ver el nivel aquí.</div>`;
  return items.map(it=>{
    const scaleMax = Math.max(it.stock, it.minStock*2, 10);
    const pct = Math.max(0, Math.min(100, (it.stock/scaleMax)*100));
    const minPct = Math.max(0, Math.min(100, (it.minStock/scaleMax)*100));
    const low = it.stock <= it.minStock;
    return `<div class="stock-row">
      <div class="stock-row-head"><b>${esc(it.name)}</b><span class="${low?'low':''}">${it.stock} ${it.unit}${low?' · bajo mínimo':''}</span></div>
      <div class="ripeness-track">
        <div class="ripeness-mask" style="width:${(100-pct).toFixed(1)}%"></div>
        <div class="ripeness-min" style="left:${minPct.toFixed(1)}%"></div>
      </div>
    </div>`;
  }).join('');
}

/* ============ MÓDULO DE LOTES ============ */
function getActiveLotes() {
  if (!DB.lotes) return { molido: null, grano: null };
  const molido = DB.lotes.find(l => l.active && (l.type === 'molido' || l.type === 'ambos')) || null;
  const grano = DB.lotes.find(l => l.active && (l.type === 'grano' || l.type === 'ambos')) || null;
  return { molido, grano };
}

function getActiveLote(type) {
  if (!DB.lotes || DB.lotes.length === 0) return null;
  if (type) {
    return DB.lotes.find(l => l.active && (l.type === type || l.type === 'ambos')) || DB.lotes.find(l => l.active) || null;
  }
  return DB.lotes.find(l => l.active) || null;
}

function getProductCost(product) {
  if (!product) return 0;
  const grindType = product.grindType || 'molido';
  const activeLote = getActiveLote(grindType);
  if (!activeLote || !product.weightGrams) {
    return parseFloat(product.cost) || 0;
  }
  const costPerGram = (parseFloat(activeLote.costPerKgRoasted) || 0) / 1000;
  const coffeeCost = costPerGram * (parseFloat(product.weightGrams) || 0);
  const packaging = parseFloat(product.packagingCost) || 0;
  return Math.round((coffeeCost + packaging) * 100) / 100;
}

function toggleComboMode(){
  const on = qs('sf-combo-toggle').checked;
  qs('sf-product-field').style.display = on ? 'none' : '';
  qs('sf-qty-field').style.display = on ? 'none' : '';
  qs('sf-combo-block').style.display = on ? '' : 'none';
  qs('sf-price-label').textContent = on ? 'Precio total del pedido (S/)' : 'Precio unitario (S/)';
  if(on) renderComboRows();
}

function comboBasesHTML(grindType, selectedId){
  const bases = DB.baseProducts.filter(b=>b.grindType===grindType);
  if(bases.length===0) return `<option value="">— sin bolsa base de ${grindType==='grano'?'Grano':'Molido'} —</option>`;
  return bases.map(b=>`<option value="${b.id}" ${b.id===selectedId?'selected':''}>${esc(b.name)} (stock: ${b.stock})</option>`).join('');
}

function comboLotesHTML(grindType, selectedId){
  const lotes = (DB.lotes||[]).filter(l=>l.type===grindType || l.type==='ambos');
  if(lotes.length===0) return `<option value="">— sin lotes para ${grindType==='grano'?'Grano':'Molido'} —</option>`;
  return lotes.map(l=>`<option value="${l.id}" ${l.id===selectedId?'selected':''}>${l.active?'⭐ ':''}${esc(l.name)} — S/${(l.costPerKgRoasted||0).toFixed(2)}/kg</option>`).join('');
}

function comboRowHTML(i, grindType){
  grindType = grindType || 'molido';
  const bases = DB.baseProducts.filter(b=>b.grindType===grindType);
  const defaultBase = bases[0];
  const lotes = (DB.lotes||[]).filter(l=>l.type===grindType || l.type==='ambos');
  const defaultLote = lotes.find(l=>l.active) || lotes[0];
  return `
    <div class="combo-row" id="combo-row-${i}" style="display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:8px; padding:8px; background:rgba(255,255,255,0.03); border-radius:6px;">
      <span style="min-width:60px; font-weight:600;">Bolsa ${i}</span>
      <select id="combo-grind-${i}" onchange="onComboGrindChange(${i})">
        <option value="molido" ${grindType==='molido'?'selected':''}>Molido</option>
        <option value="grano" ${grindType==='grano'?'selected':''}>En Grano</option>
      </select>
      <select id="combo-base-${i}" onchange="updateComboPreview()">${comboBasesHTML(grindType, defaultBase?defaultBase.id:'')}</select>
      <select id="combo-lote-${i}" onchange="updateComboPreview()">${comboLotesHTML(grindType, defaultLote?defaultLote.id:'')}</select>
      <span id="combo-unitcost-${i}" style="min-width:90px; font-weight:600; color:var(--accent-gold);">—</span>

function onComboGrindChange(i){
  const grindType = val('combo-grind-'+i);
  qs('combo-base-'+i).innerHTML = comboBasesHTML(grindType, '');
  qs('combo-lote-'+i).innerHTML = comboLotesHTML(grindType, '');
  updateComboPreview();
}

function renderComboRows(){
  const n = Math.max(1, Math.min(8, parseInt(val('sf-combo-count'))||1));
  let html = '';
  for(let i=1;i<=n;i++) html += comboRowHTML(i);
  qs('sf-combo-rows').innerHTML = html;
  updateComboPreview();
}

function getComboEntries(){
  const n = Math.max(1, Math.min(8, parseInt(val('sf-combo-count'))||1));
  const entries = [];
  for(let i=1;i<=n;i++){
    const grindType = val('combo-grind-'+i);
    const baseId = val('combo-base-'+i);
    const loteId = val('combo-lote-'+i);
    const base = baseProductById(baseId);
    const lote = (DB.lotes||[]).find(l=>l.id===loteId);
    const costPerGram = lote ? (parseFloat(lote.costPerKgRoasted)||0)/1000 : 0;
    const weight = base ? (parseFloat(base.weightGrams)||500) : 500;
    const packaging = base ? (parseFloat(base.packagingCost)||0) : 0;
    const unitCost = Math.round((costPerGram*weight + packaging)*100)/100;
    entries.push({ grindType, baseId, baseName: base?base.name:'', loteId, loteName: lote?lote.name:'', unitCost });
  }
  return entries;
}

function updateComboPreview(){
  if(!qs('sf-combo-toggle') || !qs('sf-combo-toggle').checked) return;
  const entries = getComboEntries();
  entries.forEach((e,idx)=>{ const el = qs('combo-unitcost-'+(idx+1)); if(el) el.textContent = money(e.unitCost); });
  const totalCost = entries.reduce((a,e)=>a+e.unitCost,0);
  const price = num('sf-price');
  const profit = price - totalCost;
  const el = qs('sf-combo-summary');
  if(el){
    const granoCount = entries.filter(e=>e.grindType==='grano').length;
    const molidoCount = entries.filter(e=>e.grindType==='molido').length;
    el.innerHTML = `Mezcla: <b>${granoCount} Grano + ${molidoCount} Molido</b> &nbsp;|&nbsp; Costo total estimado: <b>${money(totalCost)}</b> &nbsp;|&nbsp; Ganancia estimada: <b style="color:${profit>=0?'var(--accent-green)':'var(--accent-red)'}">${money(profit)}</b>`;
  }
}

/* ============ HISTORIAL AGRUPADO POR MES, COMO TARJETAS DESPLEGABLES ============ */
function monthLabelFull(mk){
  if(!mk) return '—';
  const parts = mk.split('-');
  const y = parts[0], m = parts[1];
  return (FULL_MONTH_NAMES[Number(m)-1]||mk) + ' ' + y;
}

function groupByMonthKey(items, dateField){
  const map = {};
  items.forEach(it=>{
    const mk = monthKey(it[dateField]);
    if(!mk) return;
    if(!map[mk]) map[mk]=[];
    map[mk].push(it);
  });
  return map;
}

// Numera 1..N en orden cronológico ascendente (1 = el más antiguo del mes, N = el más nuevo)
function numberWithinMonth(items){
  const sorted = [...items].sort((a,b)=> (a.date||'').localeCompare(b.date||'') || (a.createdAt||0)-(b.createdAt||0));
  const numMap = new Map();
  sorted.forEach((it,idx)=> numMap.set(it, idx+1));
  return numMap;
}

let historySections = {};
const historySelectedMonth = {};

const openAccIds = new Set();
function toggleAccordion(rowId){
  const item = qs(rowId);
  if(!item) return;
  const isOpen = item.classList.toggle('open');
  if(isOpen) openAccIds.add(rowId); else openAccIds.delete(rowId);
}
function restoreOpenAccordions(){
  openAccIds.forEach(id=>{ const el = qs(id); if(el) el.classList.add('open'); });
}

function renderAccordionList(sectionId, sortedItems, numMap, renderSummary, renderDetail){
  return `<div class="acc-list">
    ${sortedItems.map((it,idx)=>{
      const rowId = sectionId + '-' + (it.id || idx);
      const num = numMap.get(it);
      return `<div class="acc-item" id="${rowId}">
        <div class="acc-head" onclick="toggleAccordion('${rowId}')">
          <span class="acc-num">#${num}</span>
          ${renderSummary(it, num)}
          <span class="acc-caret">▾</span>
        </div>
        <div class="acc-body">${renderDetail(it, num)}</div>
      </div>`;
    }).join('')}
  </div>`;
}

function renderHistorySection(config){
  // config: { id, items, dateField, renderSummary(item,num), renderDetail(item,num), emptyText }
  const currentMonth = monthKey(todayStr());
  const byMonth = groupByMonthKey(config.items, config.dateField);
  historySections[config.id] = { byMonth, renderSummary: config.renderSummary, renderDetail: config.renderDetail, emptyText: config.emptyText };

  const currentItems = byMonth[currentMonth] || [];
  const pastMonthKeys = Object.keys(byMonth).filter(mk=>mk!==currentMonth).sort((a,b)=> b.localeCompare(a));
  const currentSortedDesc = [...currentItems].sort((a,b)=> (b.date||'').localeCompare(a.date||'') || (b.createdAt||0)-(a.createdAt||0));
  const currentNumMap = numberWithinMonth(currentItems);

  let html = `<div style="margin-bottom:10px; font-size:0.85rem; color:var(--text-muted);">📅 <b>${monthLabelFull(currentMonth)}</b> (mes actual) — ${currentItems.length} registro(s)</div>`;

  if(currentSortedDesc.length===0){
    html += `<div class="empty">${config.emptyText}</div>`;
  } else {
    html += renderAccordionList(config.id, currentSortedDesc, currentNumMap, config.renderSummary, config.renderDetail);
  }

  if(pastMonthKeys.length>0){
    html += `<div style="margin-top:18px;">
      <label style="display:block; margin-bottom:6px;">📂 Ver historial de un mes anterior</label>
      <select id="${config.id}-month-select" onchange="renderPastMonthDetail('${config.id}')">
        <option value="">— selecciona un mes —</option>
        ${pastMonthKeys.map(mk=>`<option value="${mk}" ${historySelectedMonth[config.id]===mk?'selected':''}>${monthLabelFull(mk)} (${byMonth[mk].length} registro(s))</option>`).join('')}
      </select>
      <div id="${config.id}-month-detail" style="margin-top:12px;">${pastMonthKeys.includes(historySelectedMonth[config.id]) ? pastMonthDetailHTML(config.id, historySelectedMonth[config.id]) : ''}</div>
    </div>`;
  }

  return html;
}

function pastMonthDetailHTML(id, mk){
  const section = historySections[id];
  if(!section || !mk) return '';
  const items = section.byMonth[mk] || [];
  const sortedDesc = [...items].sort((a,b)=> (b.date||'').localeCompare(a.date||'') || (b.createdAt||0)-(a.createdAt||0));
  const numMap = numberWithinMonth(items);
  let html = renderAccordionList(id+'-past', sortedDesc, numMap, section.renderSummary, section.renderDetail);
  html += `<div style="margin-top:6px; font-size:0.8rem; color:var(--text-muted);">Total: ${items.length} registro(s) en ${monthLabelFull(mk)}</div>`;
  return html;
}

function renderPastMonthDetail(id){
  const sel = qs(id+'-month-select');
  const mk = sel ? sel.value : '';
  const container = qs(id+'-month-detail');
  if(!container) return;
  historySelectedMonth[id] = mk;
  container.innerHTML = mk ? pastMonthDetailHTML(id, mk) : '';
  restoreOpenAccordions();
}

function pill(status){
  const st = String(status || '');
  const cls = st==='Pagado'||st==='Entregado' ? 'green' : (st==='En camino' ? 'gold' : 'red');
  return `<span class="pill ${cls}">${esc(st || 'Pendiente')}</span>`;
}

async function addSale(){
  if(rapidFire('addSale')) return;
  const isCombo = qs('sf-combo-toggle') && qs('sf-combo-toggle').checked;
  if(isCombo) return addComboSale();

  const productId = val('sf-product');
  const product = productById(productId);
  if(!product){ alert('Selecciona un producto válido.'); return; }
  const qty = num('sf-qty');
  if(qty<=0){ alert('La cantidad debe ser mayor a 0.'); return; }
  const base = product.baseProductId ? baseProductById(product.baseProductId) : null;
  const available = getAvailableUnits(product);
  if(available < qty){
    if(!confirm(`Stock insuficiente (disponible: ${available}). ¿Registrar la venta de todas formas?`)) return;
  }
  const price = num('sf-price');
  const delcost = num('sf-delcost');
  const delcharged = num('sf-delcharged');
  const total = qty * price;
  
  const unitCost = getProductCost(product);
  const costTotal = qty * unitCost;
  const profit = (total - costTotal) + (delcharged - delcost);
  const activeLote = getActiveLote(product.grindType || 'molido');

  const sale = {
    id: uid(), createdAt: Date.now(),
    date: val('sf-date') || todayStr(),
    productId, productName: product.name,
    qty, unitPrice: price, total,
    unitCostUsed: unitCost,
    loteIdUsed: activeLote ? activeLote.id : null,
    channel: val('sf-channel') || 'Otro',
    customer: String(val('sf-customer') || '').trim(),
    phone: String(val('sf-phone') || '').trim(),
    paymentStatus: val('sf-payment') || 'Pendiente',
    deliveryStatus: val('sf-delivery') || 'Pendiente',
    deliveryCost: delcost || 0, 
    deliveryCharged: delcharged || 0,
    zone: String(val('sf-zone') || '').trim(),
    profit: profit || 0,
    combo: []
  };

  DB.sales.push(sale);

  let mv;
  if(base){
    const bagsConsumed = qty * (product.unitsPerSale||1);
    base.stock -= bagsConsumed;
    mv = { id: uid(), date: sale.date, productId: base.id, productName: base.name, type:'salida', qty: bagsConsumed, reason:'Venta: ' + product.name + ' x' + qty };
  } else {
    product.stock -= qty;
    mv = { id: uid(), date: sale.date, productId, productName: product.name, type:'salida', qty, reason:'Venta' };
  }
  DB.movements.push(mv);
  const invEvsSale = invApplySale(sale, [{ grind: product.grindType||'molido', size: presentationBagSize(product), n: qty*(product.unitsPerSale||1), loteId: null }], val('sf-dispatch')||'lima', qty, product.unitsPerSale||1);
  saveDB(false);
  renderVentas();
  await syncRemote('addSale', sale);
  await syncItems('inv_events', invEvsSale);
  if(base) await syncRemote('updateBaseProduct', base);
  else await syncRemote('updateProduct', product);
  await syncRemote('addMovement', mv);
}

async function addComboSale(){
  const entries = getComboEntries();
  if(entries.length===0){ alert('Agrega al menos una bolsa a la combinación.'); return; }
  const missingBase = entries.some(e=>!e.baseId);
  if(missingBase){ alert('Falta vincular alguna bolsa a un producto base. Revisa Configuración → Stock físico real.'); return; }

  const neededByBase = {};
  entries.forEach(e=>{ neededByBase[e.baseId] = (neededByBase[e.baseId]||0) + 1; });
  const shortages = Object.keys(neededByBase).map(bid=>{
    const b = baseProductById(bid);
    return b && b.stock < neededByBase[bid] ? `${b.name} (disponible: ${b.stock}, necesitas: ${neededByBase[bid]})` : null;
  }).filter(Boolean);
  if(shortages.length>0){
    if(!confirm(`Stock insuficiente: ${shortages.join(', ')}. ¿Registrar la venta de todas formas?`)) return;
  }

  const price = num('sf-price');
  const delcost = num('sf-delcost');
  const delcharged = num('sf-delcharged');
  const totalCost = entries.reduce((a,e)=>a+e.unitCost,0);
  const profit = (price - totalCost) + (delcharged - delcost);

  const granoCount = entries.filter(e=>e.grindType==='grano').length;
  const molidoCount = entries.filter(e=>e.grindType==='molido').length;
  const autoName = `Pack Mixto (${granoCount?granoCount+' Grano':''}${granoCount&&molidoCount?' + ':''}${molidoCount?molidoCount+' Molido':''})`;
  const productName = String(val('sf-combo-name') || '').trim() || autoName;

  const sale = {
    id: uid(), createdAt: Date.now(),
    date: val('sf-date') || todayStr(),
    productId: '', productName,
    qty: 1, unitPrice: price, total: price,
    unitCostUsed: Math.round((totalCost/entries.length)*100)/100,
    loteIdUsed: entries[0] ? entries[0].loteId : null,
    channel: val('sf-channel') || 'Otro',
    customer: String(val('sf-customer') || '').trim(),
    phone: String(val('sf-phone') || '').trim(),
    paymentStatus: val('sf-payment') || 'Pendiente',
    deliveryStatus: val('sf-delivery') || 'Pendiente',
    deliveryCost: delcost || 0,
    deliveryCharged: delcharged || 0,
    zone: String(val('sf-zone') || '').trim(),
    profit: profit || 0,
    combo: entries.map(e=>({ grindType: e.grindType, loteId: e.loteId, loteName: e.loteName, unitCost: e.unitCost }))
  };

  DB.sales.push(sale);

  const movements = [];
  Object.keys(neededByBase).forEach(bid=>{
    const b = baseProductById(bid);
    if(!b) return;
    b.stock -= neededByBase[bid];
    const lotesUsados = [...new Set(entries.filter(e=>e.baseId===bid).map(e=>e.loteName).filter(Boolean))].join(', ');
    movements.push({ id: uid(), date: sale.date, productId: b.id, productName: b.name, type:'salida', qty: neededByBase[bid], reason: 'Venta combinada: ' + productName + (lotesUsados ? ' (Lotes: '+lotesUsados+')' : '') });
  });
  DB.movements.push(...movements);
  const comboParts = {};
  entries.forEach(e=>{
    const b = baseProductById(e.baseId);
    const size = (b && Number(b.weightGrams)) || 500;
    const k = e.grindType+'|'+size+'|'+e.loteId;
    if(!comboParts[k]) comboParts[k] = { grind:e.grindType, size, n:0, loteId:e.loteId||'' };
    comboParts[k].n += 1;
  });
  const invEvsCombo = invApplySale(sale, Object.values(comboParts), val('sf-dispatch')||'lima', 1, entries.length);

  saveDB(false);
  renderVentas();
  await syncRemote('addSale', sale);
  await syncItems('inv_events', invEvsCombo);
  for(const bid of Object.keys(neededByBase)){
    const b = baseProductById(bid);
    if(b) await syncRemote('updateBaseProduct', b);
  }
  for(const mv of movements){
    await syncRemote('addMovement', mv);
  }
}

async function deleteSale(id){
  if(!confirm('¿Eliminar esta venta? El stock se devolverá.')) return;
  const sale = DB.sales.find(s=>s.id===id);
  let product = null, base = null, mv = null;
  if(sale){
    product = productById(sale.productId);
    if(product){
      base = product.baseProductId ? baseProductById(product.baseProductId) : null;
      if(base){
        const bagsBack = sale.qty * (product.unitsPerSale||1);
        base.stock += bagsBack;
        mv = { id: uid(), date: todayStr(), productId: base.id, productName: base.name, type:'entrada', qty: bagsBack, reason:'Reversión de venta eliminada: ' + product.name };
      } else {
        product.stock += sale.qty;
        mv = { id: uid(), date: todayStr(), productId: sale.productId, productName: sale.productName, type:'entrada', qty: sale.qty, reason:'Reversión de venta eliminada' };
      }
      DB.movements.push(mv);
    }
  }
  DB.sales = DB.sales.filter(s=>s.id!==id);
  const removedInvIds = invRemoveSaleEvents(id);
  saveDB(false);
  renderVentas();
  await syncRemote('deleteSale', {id});
  await syncDeleteItems('inv_events', removedInvIds);
  if(base) await syncRemote('updateBaseProduct', base);
  else if(product) await syncRemote('updateProduct', product);
  if(mv) await syncRemote('addMovement', mv);
}

async function markPaid(id){
  const sale = DB.sales.find(s=>s.id===id);
  if(sale){
    sale.paymentStatus='Pagado';
    saveDB(false);
    renderView(currentView);
    await syncRemote('updateSale', sale);
  }
}

async function saveSaleEdit(id) {
  const sale = DB.sales.find(s => s.id === id);
  if (!sale) return;

  sale.customer = String(val('es-customer') || '').trim();
  sale.phone = String(val('es-phone') || '').trim();
  sale.deliveryCost = num('es-delcost') || 0;
  sale.deliveryCharged = num('es-delcharged') || 0;
  sale.total = num('es-total') || 0;
  sale.zone = String(val('es-zone') || '').trim();

  const costTotal = (sale.qty || 1) * (sale.unitCostUsed || 0);
  sale.profit = (sale.total - costTotal) + (sale.deliveryCharged - sale.deliveryCost);

  saveDB(false);
  const y = window.scrollY;
  renderView(currentView);   // actualiza la lista de fondo; el modal sigue abierto
  window.scrollTo(0, y);
  flashSaved('es-saved-flag');
  await syncRemote('updateSale', sale);
}

async function addMovement(){
  const raw = val('mv-product');
  if(!raw){ alert('Selecciona un producto.'); return; }
  const [kind, id] = raw.split(':');
  const qty = num('mv-qty');
  if(qty<=0){ alert('La cantidad debe ser mayor a 0.'); return; }
  const type = val('mv-type');
  const reason = val('mv-reason');
  let mv;
  if(kind==='base'){
    const base = baseProductById(id);
    if(!base){ alert('Producto base no encontrado.'); return; }
    base.stock += (type==='entrada' ? qty : -qty);
    mv = { id: uid(), date: todayStr(), productId: base.id, productName: base.name, type, qty, reason };
    DB.movements.push(mv);
    saveDB(false);
    renderStock();
    await syncRemote('addMovement', mv);
    await syncRemote('updateBaseProduct', base);
  } else {
    const product = productById(id);
    if(!product){ alert('Producto no encontrado.'); return; }
    product.stock += (type==='entrada' ? qty : -qty);
    mv = { id: uid(), date: todayStr(), productId: product.id, productName: product.name, type, qty, reason };
    DB.movements.push(mv);
    saveDB(false);
    renderStock();
    await syncRemote('addMovement', mv);
    await syncRemote('updateProduct', product);
  }
}

/* ============ CLIENTES (agrupado por teléfono: historial, LTV, nuevo vs recurrente) ============ */
function normalizePhone(p){
  return String(p||'').replace(/\D/g,''); // solo dígitos, para poder agrupar aunque el formato varíe
}

const DORMANT_DAYS = 30;

function daysBetween(dateStrA, dateStrB){
  const a = new Date(dateStrA+'T00:00:00');
  const b = new Date(dateStrB+'T00:00:00');
  return Math.round((b-a) / 86400000);
}

function computeCustomers(){
  const withPhone = {};
  const noPhone = [];
  DB.sales.forEach(s=>{
    const key = normalizePhone(s.phone);
    if(!key){ noPhone.push(s); return; }
    if(!withPhone[key]) withPhone[key] = [];
    withPhone[key].push(s);
  });

  const today = todayStr();
  const customers = Object.keys(withPhone).map(key=>{
    const sales = withPhone[key].slice().sort((a,b)=> (a.date||'').localeCompare(b.date||'') || (a.createdAt||0)-(b.createdAt||0));
    const first = sales[0];
    const last = sales[sales.length-1];
    const totalSpent = sum(sales.map(s=>s.total||0));
    const totalProfit = sum(sales.map(s=>s.profit||0));
    const purchaseCount = sales.length;
    const daysSinceLast = daysBetween(last.date, today);
    const isRecurrent = purchaseCount > 1;
    const isDormant = daysSinceLast >= DORMANT_DAYS;
    // Reposición: cuánto café compró la última vez y cuánto le dura (gramos por día = ajuste)
    const lastProd = productById(last.productId);
    const gramsLast = (Array.isArray(last.combo) && last.combo.length>0)
      ? last.combo.length * 500
      : ((lastProd && lastProd.weightGrams ? lastProd.weightGrams : 500) * (last.qty||1));
    const gpd = Number(getSetting('gramsPerDay')) || 20;
    const daysLeft = Math.round(gramsLast / gpd - daysSinceLast);
    const needsRestock = daysLeft <= 7 && daysSinceLast < 60;
    // el nombre más reciente no vacío (por si cambiaron cómo lo escribieron)
    const nameCandidate = [...sales].reverse().find(s=>String(s.customer||'').trim())?.customer || '';
    return {
      phone: key, displayPhone: last.phone || first.phone, name: nameCandidate,
      sales, firstSale: first, lastSale: last, totalSpent, totalProfit, purchaseCount,
      daysSinceLast, isRecurrent, isDormant, gramsLast, daysLeft, needsRestock,
      avgTicket: purchaseCount>0 ? totalSpent/purchaseCount : 0
    };
  });

  return { customers, noPhone };
}

function customerKPIs(customers){
  const total = customers.length;
  const recurrentes = customers.filter(c=>c.isRecurrent).length;
  const dormidos = customers.filter(c=>c.isDormant).length;
  const pctRecurrentes = total>0 ? (recurrentes/total*100) : 0;
  const avgLTV = total>0 ? sum(customers.map(c=>c.totalSpent))/total : 0;
  return { total, recurrentes, dormidos, pctRecurrentes, avgLTV };
}

function waLink(phoneDigits, name){
  let d = String(phoneDigits||'').replace(/\D/g,'');
  if(d.length===9) d = '51'+d;
  const first = String(name||'').trim().split(' ')[0];
  const msg = `Hola ${first||''}, soy de Casa Vieja ☕ ¿Cómo te fue con tu café? Si ya se te está acabando, te preparo tu siguiente pedido. ¿Te animas?`;
  return '#RECURSO_BLOQUEADO'+d+'?text='+encodeURIComponent(msg);
}

  clientesFilter = f;
  renderClientes();
}

  else if(clientesFilter==='dormidos') filtered = customers.filter(c=>c.isDormant);
  else if(clientesFilter==='reponer') filtered = customers.filter(c=>c.needsRestock);

  // Orden: primero los más valiosos (mayor LTV), luego por última compra más reciente
  filtered = [...filtered].sort((a,b)=> b.totalSpent - a.totalSpent);

  const html = `

      <div class="card"><p class="kpi-label">LTV promedio</p><p class="kpi-value">${money(k.avgLTV)}</p><p class="kpi-sub">Gasto histórico promedio por cliente</p></div>

      <span class="hint" style="margin:0;">Con esto se estima cuándo se les acaba el café.</span>
    </div>

    ${filtered.length===0 ? `<div class="empty">No hay clientes en este filtro.</div>` : `
    <div class="acc-list">
      ${filtered.map((c,idx)=>{
        const rowId = 'cliente-'+c.phone;

const FUND_PRESETS = {
  suave:       { s: 5,  u: 10, label: 'Suave' },

};

function applyFundPreset(k){
  const pr = FUND_PRESETS[k]; if(!pr) return;
  qs('fd-pct-s').value = pr.s;
  qs('fd-pct-u').value = pr.u;
}

async function saveFundConfig(){
  const pS = Math.min(100, Math.max(0, num('fd-pct-s')));
  const pU = Math.min(100, Math.max(0, num('fd-pct-u')));
  const months = Math.min(12, Math.max(1, num('fd-months') || 3));
  const start = val('fd-start') || monthKey(todayStr());
  await saveSettings({ fundPctSueldo: pS, fundPctUtilidad: pU, fundMonthsTarget: months, fundStartMonth: start });
  renderFondo();
  showSyncBanner('✓ Fondo guardado', false);
}

async function addFundUse(){
  const amount = num('fu-amount');
  const concept = String(val('fu-concept')||'').trim();
  if(amount<=0){ alert('Ingresa un monto mayor a 0.'); return; }
  if(!concept){ alert('Escribe en qué se usó el fondo (ej: máquina de sellado).'); return; }
  const item = { id: uid(), date: val('fu-date') || todayStr(), concept, amount };
  DB.fund = DB.fund || [];
  DB.fund.push(item);
  saveDB(false);
  renderFondo();
  await syncRemote('upsertItem', { collection:'fund', item });
}

async function deleteFundUse(id){

  await syncRemote('deleteItem', { collection:'fund', id });
