<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulacro privado</title><style>body{font:17px system-ui;margin:24px auto;max-width:850px;padding:16px;color:#253b31;background:#faf8f2}button{padding:14px;border:0;border-radius:12px;background:#285541;color:white;font:inherit;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}p{line-height:1.5}button:focus-visible{outline:3px solid #a65d17}</style><h1>Casa Vieja · Simulacro privado</h1><p>Solo datos ficticios. No ejecuta un corte comercial, no habilita usuarios y no accede a producción. La repetición continúa el mismo ensayo.</p><button id="run">Ejecutar o continuar simulacro</button> <button id="read">Consultar avance</button><p id="status" role="status">Pendiente de consulta</p><pre id="report"></pre><script>
const $=id=>document.getElementById(id),call=name=>new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name]());let busy=false;function show(m){$('report').textContent=JSON.stringify(m,null,2);$('status').textContent=m?.done?'Simulacro sintético terminado. Pruebas físicas y cuentas reales aún pendientes.':m?'Avance: '+m.step+' de 21 pasos':'Sin iniciar';}async function read(){try{show(await call('operationalState'))}catch(e){$('status').textContent='No confirmado: '+e.message}}$('read').onclick=read;$('run').onclick=async()=>{if(busy)return;busy=true;$('run').disabled=true;try{let m;do{m=await call('operationalNext');show(m)}while(!m.done)}catch(e){$('status').textContent='Interrumpido. Conserva el avance y vuelve a continuar: '+e.message}finally{busy=false;$('run').disabled=false}};read();
</script></html>
