<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ensayo privado 5C</title><style>body{font:16px system-ui;background:#1c1410;color:#f2e9dc;margin:24px}button{padding:14px;background:#d4a34a;color:#231a12;border:0;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>Casa Vieja · Ensayo privado 5C</h1><p>Solo datos e identidades ficticias. Tres solicitudes simultáneas del propietario; no certifica inicio de sesión de tres cuentas reales.</p><button id="run">Probar tres solicitudes simultáneas</button><p id="status" role="status">Pendiente</p><pre id="results"></pre><script>
const rpc=(method,arg)=>new Promise((resolve,reject)=>{const r=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);if(method==='race')r.lab5cRace(arg);else r.lab5cRaceCleanup();});
document.getElementById('run').onclick=async()=>{document.getElementById('run').disabled=true;document.getElementById('status').textContent='Ejecutando en Google…';try{const start=performance.now(),requests=await Promise.all([1,2,3].map(slot=>rpc('race',slot))),cleanup=await rpc('cleanup');const report={environment:'GOOGLE_PRIVATE_DEV_SYNTHETIC',requests,cleanup,browserTotalMs:performance.now()-start,passed:requests.every(r=>!r.error)&&cleanup.passed===true};document.getElementById('results').textContent=JSON.stringify(report,null,2);document.getElementById('status').textContent=report.passed?'Ensayo aprobado. No habilita producción.':'Revisar resultados.';}catch(e){document.getElementById('status').textContent='Sin confirmar: '+e.message;}finally{document.getElementById('run').disabled=false}};
</script></html>
