<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- CONFIGURACIÓN DE PWA Y VISTA MÓVIL (IPHONE / PC) -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Casa Vieja">

<title>Casa Vieja · Control de Operaciones</title>

<style>
  :root{
    --bg:#1C1410;
    --surface:#241B15;
    --surface-2:#2E241C;
    --surface-3:#382B20;
    --border:#3D2F24;
    --text:#F2E9DC;
    --text-muted:#A8998A;
    --accent-red:#C1432E;
    --accent-gold:#D4A34A;
    --accent-green:#6B8F5C;
    --accent-blue:#5C7F8F;
    --radius:10px;
    --font-display:'Iowan Old Style','Palatino Linotype',Georgia,serif;
    --font-body:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    padding-bottom:env(safe-area-inset-bottom); /* Ajuste de barra inferior de iPhone */
  }
  #app{display:flex;min-height:100vh;}
  
  /* Sidebar */
  .sidebar{
    width:220px;flex-shrink:0;background:var(--surface);
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;padding:20px 0;
  }
  .brand{padding:0 20px 18px 20px;border-bottom:1px solid var(--border);margin-bottom:10px;}
  .brand h1{font-family:var(--font-display);font-size:20px;margin:0 0 2px 0;font-weight:600;letter-spacing:.3px;}
  .brand span{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;}
  nav.navlist{
    display:flex;flex-direction:column;gap:2px;padding:0 10px;
    -webkit-overflow-scrolling:touch; /* Scroll fluido en móvil */
  }
  .nav-btn{
    display:flex;align-items:center;gap:10px;
    background:none;border:none;color:var(--text-muted);
    padding:10px 12px;border-radius:8px;cursor:pointer;
    font-size:14px;text-align:left;font-family:var(--font-body);
    transition:background .15s, color .15s;
  }
  .nav-btn svg{flex-shrink:0;opacity:.8;}
  .nav-btn:hover{background:var(--surface-2);color:var(--text);}
  .nav-btn.active{background:var(--surface-3);color:var(--text);font-weight:600;}
  .nav-btn.active svg{opacity:1;}
  .sidebar-footer{margin-top:auto;padding:14px 20px 0 20px;border-top:1px solid var(--border);}
  .sidebar-footer p{font-size:11px;color:var(--text-muted);line-height:1.5;margin:10px 0 0 0;}
  #connStatus.online{color:var(--accent-green);}
  #connStatus.offline{color:var(--text-muted);}
  
  /* Main */
  .main{flex:1;min-width:0;padding:26px 34px 60px 34px;}
  .topbar{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px;flex-wrap:wrap;gap:8px;}
  .topbar h2{font-family:var(--font-display);font-size:26px;margin:0;font-weight:600;}
  .topbar .today{font-size:13px;color:var(--text-muted);}
  .view{display:none;}
  .view.active{display:block;animation:fadein .2s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  
  /* Cards / grid */
  .grid{display:grid;gap:14px;}
  .grid-kpi{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:22px;}
  .grid-charts{grid-template-columns:repeat(auto-fit,minmax(320px,1fr));}
  .card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:16px 18px;
  }
  .kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-muted);margin:0 0 8px 0;}
  .kpi-value{font-family:var(--font-display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;margin:0;}
  .kpi-value.red{color:var(--accent-red);}
  .kpi-value.gold{color:var(--accent-gold);}
  .kpi-value.green{color:var(--accent-green);}
  .kpi-sub{font-size:11px;color:var(--text-muted);margin-top:6px;}
  .card h3{font-size:14px;margin:0 0 14px 0;font-weight:600;color:var(--text);}
  .card h3 small{display:block;font-size:11px;color:var(--text-muted);font-weight:400;margin-top:2px;}
  
  /* Chart bits */
  .chart-svg{width:100%;height:auto;display:block;}
  .legend{display:flex;flex-direction:column;gap:6px;margin-top:12px;font-size:12px;}
  .legend-row{display:flex;align-items:center;gap:8px;justify-content:space-between;}
  .legend-left{display:flex;align-items:center;gap:8px;color:var(--text-muted);}
  .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .donut-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap;}
  .donut{width:120px;height:120px;border-radius:50%;position:relative;flex-shrink:0;}
  .donut::after{content:'';position:absolute;inset:22px;background:var(--surface);border-radius:50%;}
  .donut-center{position:absolute;inset:22px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-muted);text-align:center;z-index:2;}
  
  /* Ripeness stock scale */
  .stock-row{margin-bottom:14px;}
  .stock-row-head{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;}
  .stock-row-head b{font-weight:600;}
  .stock-row-head span.low{color:var(--accent-red);font-weight:600;}
  .ripeness-track{position:relative;height:10px;border-radius:6px;overflow:hidden;
    background:linear-gradient(90deg,var(--accent-red) 0%,var(--accent-gold) 45%,var(--accent-green) 100%);}
  .ripeness-mask{position:absolute;top:0;right:0;height:100%;background:var(--surface-2);}
  .ripeness-min{position:absolute;top:-2px;width:2px;height:14px;background:var(--text);opacity:.8;}
  
  /* Forms */
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px;}
  label{display:block;font-size:11px;color:var(--text-muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;}
  input,select{
    width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    padding:9px 10px;border-radius:7px;font-size:13.5px;font-family:var(--font-body);
  }
  input:focus,select:focus{outline:2px solid var(--accent-gold);outline-offset:1px;}
  .btn{
    background:var(--accent-gold);color:#231A12;border:none;padding:10px 16px;
    border-radius:7px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:var(--font-body);
  }
  .btn:hover{filter:brightness(1.08);}
  .btn.secondary{background:var(--surface-3);color:var(--text);border:1px solid var(--border);}
  .btn.danger{background:var(--accent-red);color:#fff;}
  .btn.small{padding:5px 10px;font-size:12px;}
  .btn:focus-visible, .nav-btn:focus-visible, select:focus-visible, input:focus-visible{outline:2px solid var(--accent-gold);outline-offset:2px;}
  
  /* Table */
  .table-wrap{
    overflow-x:auto;
    -webkit-overflow-scrolling:touch; /* Scroll suave en tablas para iPhone */
  }
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
  tr:last-child td{border-bottom:none;}
  .pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
  .pill.green{background:rgba(107,143,92,.18);color:var(--accent-green);}
  .pill.gold{background:rgba(212,163,74,.18);color:var(--accent-gold);}
  .pill.red{background:rgba(193,67,46,.18);color:var(--accent-red);}
  .empty{color:var(--text-muted);font-size:13px;padding:24px 4px;text-align:center;border:1px dashed var(--border);border-radius:var(--radius);}
  .section-title{font-family:var(--font-display);font-size:18px;font-weight:600;margin:26px 0 12px 0;}
  .section-title:first-child{margin-top:0;}
  .row-actions{display:flex;gap:6px;}
  .hint{font-size:11.5px;color:var(--text-muted);margin-top:-4px;margin-bottom:14px;}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .flexend{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;}
  
  /* ADAPTACIÓN MÓVIL (IPHONE / SMARTPHONES) */
  @media (max-width:880px){
    #app{flex-direction:column;}
    .sidebar{
      width:100%;flex-direction:row;overflow-x:auto;align-items:center;
      padding: max(16px, env(safe-area-inset-top)) 12px 12px 12px; /* baja el header para que no quede bajo el notch/status bar */
    }
    .brand{border:none;padding:0 14px 0 4px;margin:0;}
    nav.navlist{flex-direction:row;padding:0;}
    .sidebar-footer{display:none;}
    .main{padding:16px 16px 50px 16px;}
    
    /* Previene el zoom automático en Safari de iPhone al tocar inputs */
    input, select, textarea {
      font-size: 16px !important;
    }
    
    .btn, .nav-btn {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
  }
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <h1>Casa Vieja</h1>
      <span>Control de operaciones</span>
    </div>
    <nav class="navlist" id="navlist">
      <button class="nav-btn" data-view="dashboard" onclick="switchView('dashboard')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="12" width="4" height="9"/><rect x="10" y="6" width="4" height="15"/><rect x="17" y="3" width="4" height="18"/></svg>
        Dashboard
      </button>
      <button class="nav-btn" data-view="ventas" onclick="switchView('ventas')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/><path d="M2 3h2l2.6 12.6a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.6L21 7H5.2"/></svg>
        Ventas
      </button>
      <button class="nav-btn" data-view="stock" onclick="switchView('stock')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
        Stock
      </button>
      <button class="nav-btn" data-view="ads" onclick="switchView('ads')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11v2a1 1 0 0 0 1 1h3l5 4V6L7 10H4a1 1 0 0 0-1 1z"/><path d="M16 8a4 4 0 0 1 0 8"/></svg>
        Ads
      </button>
      <button class="nav-btn" data-view="egresos" onclick="switchView('egresos')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7h18v13H3z"/><path d="M3 7l4-4h10l4 4"/><path d="M8 12h8"/></svg>
        Egresos
      </button>
      <button class="nav-btn" data-view="delivery" onclick="switchView('delivery')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="1" y="7" width="13" height="9"/><path d="M14 10h4l3 3v3h-7z"/><circle cx="5.5" cy="18" r="1.6"/><circle cx="16.5" cy="18" r="1.6"/></svg>
        Delivery
      </button>
      <button class="nav-btn" data-view="config" onclick="switchView('config')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
        Configuración
      </button>
    </nav>
    <div class="sidebar-footer">
      <p id="connStatus">● Modo local — solo en este navegador</p>
      <p>Haz backup seguido desde Configuración.</p>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h2 id="pageTitle">Dashboard</h2>
      <div class="today" id="todayLabel"></div>
    </div>
    <section class="view" id="view-dashboard"></section>
    <section class="view" id="view-ventas"></section>
    <section class="view" id="view-stock"></section>
    <section class="view" id="view-ads"></section>
    <section class="view" id="view-egresos"></section>
    <section class="view" id="view-delivery"></section>
    <section class="view" id="view-config"></section>
  </main>
</div>

<script>
/* ============ CONFIG / CONSTANTS ============ */
const STORE_KEY = 'cvc_control_v1';
const COLORS = { red:'#C1432E', gold:'#D4A34A', green:'#6B8F5C', blue:'#5C7F8F', muted:'#A8998A', surface2:'#2E241C', text:'#F2E9DC' };
const CHANNELS = ['Meta Ads (Facebook/Instagram)','WhatsApp directo','Instagram orgánico','Referido','Otro'];
const PAYMENT_STATUSES = ['Pagado','Pendiente'];
const DELIVERY_STATUSES = ['Pendiente','En camino','Entregado'];
const MONTH_NAMES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Set','Oct','Nov','Dic'];
const TITLES = { dashboard:'Dashboard', ventas:'Ventas', stock:'Stock', ads:'Ads', egresos:'Egresos', delivery:'Delivery', config:'Configuración' };
const EXPENSE_CATEGORIES = ['Café verde / insumo','Empaques y etiquetas','Tostado / maquila','Transporte','Marketing (fuera de ads)','Servicios / alquiler','Otros'];
const CONN_KEY = 'cvc_connection_v1';

/* ============ STATE / PERSISTENCE (LOCAL-FIRST Y PROTEGIDO) ============ */
let DB = loadDB();
let currentView = 'dashboard';

function defaultDB(){ 
  return { products:[], sales:[], movements:[], ads:[], expenses:[], lotes:[], baseProducts:[] }; 
}

function loadDB(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return defaultDB();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultDB(), parsed);
  } catch(e) { 
    console.error('Error cargando datos locales:', e); 
    return defaultDB(); 
  }
}

// 🛡️ 1. GUARDA SIEMPRE EN LOCALSTORAGE DE FORMA INMEDIATA Y SAGRADA
function saveDB(){
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(DB));
  } catch(e) {
    console.error('Error guardando en localStorage:', e);
  }
  // 🚀 2. Envía a Google Sheets en segundo plano
  syncToRemote();
}

/* ============ SINCRONIZACIÓN PROTEGIDA CON GOOGLE SHEETS ============ */
async function syncToRemote(){
  const url = localStorage.getItem('cv_script_url');
  const token = localStorage.getItem('cv_script_token');
  if(!url || !token) return;

  try {
    await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ token: token, db: DB }),
      redirect: 'follow'
    });
  } catch(e) {
    console.error("Error al enviar datos a Google Sheets:", e);
  }
}

// 🛡️ 3. DESCARGA PROTEGIDA: NUNCA BORRA TUS DATOS SI GOOGLE SHEETS ESTÁ VACÍO
async function refreshFromRemote(){
  const url = localStorage.getItem('cv_script_url');
  if(!url) return false;

  try {
    const res = await fetch(url, { redirect: 'follow' });
    const text = await res.text();
    
    // Si Google Sheets está vacío, NO BORRA NADA. Le sube los datos de la laptop a Google Sheets
    if(!text || text.trim() === '' || text.trim() === '{}') {
      syncToRemote();
      return false;
    }

    const remoteDB = JSON.parse(text);
    if(remoteDB && typeof remoteDB === 'object'){
      // Verificar si Google Sheets realmente tiene datos reales
      const tieneDatos = Object.values(remoteDB).some(arr => Array.isArray(arr) && arr.length > 0);
      
      if(tieneDatos) {
        DB = Object.assign(defaultDB(), remoteDB);
        localStorage.setItem(STORE_KEY, JSON.stringify(DB));
        if(typeof renderView === 'function') renderView(currentView);
        return true;
      } else {
        // Si la nube está vacía pero la laptop tiene datos, los sube
        syncToRemote();
      }
    }
  } catch(e){
    console.error("Error al descargar de Google Sheets:", e);
  }
  return false;
}
/* ============ HELPERS ============ */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function qs(id){ return document.getElementById(id); }
function val(id){ const el = qs(id); return el ? el.value : ''; }
function num(id){ const v = parseFloat(val(id)); return isNaN(v) ? 0 : v; }
function sum(arr){ return arr.reduce((a,b)=>a+(Number(b)||0),0); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function monthKey(dateStr){ return (dateStr||'').slice(0,7); }
function money(n){ return 'S/ ' + (Number(n)||0).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString('es-PE',{day:'2-digit',month:'short',year:'numeric'});
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function productById(id){ return DB.products.find(p=>p.id===id); }
function baseProductById(id){ return DB.baseProducts.find(b=>b.id===id); }
/**
 * Stock disponible de una presentación (Tripack, Duopack, Unitario, etc.)
 * Si está vinculada a un producto base (bolsas físicas), se calcula a partir
 * de esas bolsas. Si no está vinculada (producto viejo, aún no migrado),
 * usa su propio contador de stock como respaldo.
 */
function getAvailableUnits(product){
  if(product.baseProductId){
    const base = baseProductById(product.baseProductId);
    if(!base) return 0;
    const units = product.unitsPerSale || 1;
    return Math.floor(base.stock / units);
  }
  return product.stock;
}
function movementTargets(){
  const targets = DB.baseProducts.map(b=>({ id:b.id, kind:'base', label: b.name + ' — bolsas físicas' }));
  DB.products.filter(p=>!p.baseProductId).forEach(p=>{ targets.push({ id:p.id, kind:'product', label: p.name + ' (stock propio, sin vincular)' }); });
  return targets;
}

/* ============ CONEXIÓN A GOOGLE SHEETS ============ */
function getConnConfig(){
  try{ return JSON.parse(localStorage.getItem(CONN_KEY)) || {url:'', token:''}; }
  catch(e){ return {url:'', token:''}; }
}
function saveConnConfig(cfg){ localStorage.setItem(CONN_KEY, JSON.stringify(cfg)); }
function isConnected(){ const c = getConnConfig(); return !!(c.url && c.token); }
function updateConnBadge(){
  const el = qs('connStatus');
  if(!el) return;
  if(isConnected()){ el.textContent = '● Conectado a Google Sheets'; el.className='online'; }
  else { el.textContent = '● Modo local — solo en este navegador'; el.className='offline'; }
}
async function apiGet(){
  const c = getConnConfig();
  const res = await fetch(c.url + '?token=' + encodeURIComponent(c.token));
  return await res.json();
}
async function apiPost(action, payload){
  const c = getConnConfig();
  const res = await fetch(c.url, { method:'POST', body: JSON.stringify({ token:c.token, action, payload }) });
  return await res.json();
}
async function syncRemote(action, payload){
  if(!isConnected()) return {ok:true};
  try{
    const res = await apiPost(action, payload);
    if(res && res.error){ alert('Se guardó localmente, pero no se pudo sincronizar con Google Sheets: ' + res.error); }
    return res;
  }catch(e){
    alert('Se guardó localmente, pero no se pudo conectar con Google Sheets: ' + e.message);
    return { error: e.message };
  }
}
function normalizeProduct(p){ return { id:String(p.id), name:String(p.name||''), price:Number(p.price)||0, cost:Number(p.cost)||0, stock:Number(p.stock)||0, minStock:Number(p.minStock)||0, weightGrams:Number(p.weightGrams)||0, packagingCost:Number(p.packagingCost)||0, grindType:String(p.grindType||'molido'), baseProductId:String(p.baseProductId||''), unitsPerSale:Number(p.unitsPerSale)||1 }; }

async function refreshFromRemote(){
  if(!isConnected()) return false;
  try{
    const data = await apiGet();
    if(!data || data.error){ console.error('Error de Sheets:', data && data.error); return false; }
    DB = {
      products: (data.products||[]).map(normalizeProduct),
      sales: (data.sales||[]).map(normalizeSale),
      movements: data.movements||[],
      ads: (data.ads||[]).map(normalizeAd),
      expenses: (data.expenses||[]).map(normalizeExpense),
      lotes: (data.lotes||[]).map(normalizeLote),
      baseProducts: (data.baseProducts||[]).map(normalizeBaseProduct)
    };
    saveDB();
    return true;
  }catch(e){ console.error(e); return false; }
}
async function connectSheets(){
  const url = val('cfg-url').trim();
  const token = val('cfg-token').trim();
  if(!url || !token){ alert('Completa la URL y el token.'); return; }
  saveConnConfig({url, token});
  qs('cfg-conn-status').textContent = 'Probando conexión…';
  try{
    const data = await apiGet();
    if(!data || data.error){
      qs('cfg-conn-status').textContent = '✗ ' + (data && data.error ? data.error : 'No se pudo conectar.');
      return;
    }
    qs('cfg-conn-status').textContent = '✓ Conectado. Trayendo datos de Sheets…';
    await refreshFromRemote();
    updateConnBadge();
    renderConfig();
    alert('Conectado a Google Sheets. Ya puedes compartir el archivo con tus socios.');
  }catch(e){
    qs('cfg-conn-status').textContent = '✗ ' + e.message;
  }
}
function disconnectSheets(){
  if(!confirm('¿Volver a modo local? Dejarás de sincronizar con Google Sheets.')) return;
  saveConnConfig({url:'', token:''});
  updateConnBadge();
  renderConfig();
}

/* ============ CHART HELPERS ============ */
function svgBars(values, labels, color, opts){
  opts = opts||{};
  const w = opts.w||560, h = opts.h||190, padL=8, padR=8, padT=10, padB=24;
  const plotW = w-padL-padR, plotH = h-padT-padB;
  const max = Math.max(1, ...values.map(v=>Math.abs(v)));
  const n = values.length || 1;
  const slot = plotW/n;
  const barW = Math.max(4, slot*0.55);
  let bars='', labelsSvg='';
  values.forEach((v,i)=>{
    const bh = max ? (Math.abs(v)/max)*plotH : 0;
    const x = padL + i*slot + (slot-barW)/2;
    const y = padT + (plotH-bh);
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(bh,1).toFixed(1)}" rx="2.5" fill="${color}"><title>${esc(labels[i])}: ${v.toFixed ? v.toFixed(2) : v}</title></rect>`;
    if(labels[i]!==undefined){
      labelsSvg += `<text x="${(x+barW/2).toFixed(1)}" y="${h-8}" font-size="9" fill="${COLORS.muted}" text-anchor="middle">${esc(labels[i])}</text>`;
    }
  });
  return `<svg viewBox="0 0 ${w} ${h}" class="chart-svg" preserveAspectRatio="xMidYMid meet">
    <line x1="${padL}" y1="${padT+plotH}" x2="${w-padR}" y2="${padT+plotH}" stroke="${COLORS.surface2}" stroke-width="1"/>
    ${bars}${labelsSvg}
  </svg>`;
}
function svgGroupedBars(labelsX, seriesA, seriesB, colorA, colorB){
  const w=560, h=200, padL=8, padR=8, padT=10, padB=24;
  const plotW=w-padL-padR, plotH=h-padT-padB;
  const max = Math.max(1, ...seriesA, ...seriesB);
  const n = labelsX.length || 1;
  const slot = plotW/n;
  const barW = Math.max(3, slot*0.32);
  let bars='', labelsSvg='';
  labelsX.forEach((lab,i)=>{
    const va = seriesA[i]||0, vb = seriesB[i]||0;
    const ha = (va/max)*plotH, hb=(vb/max)*plotH;
    const groupX = padL + i*slot + slot*0.14;
    const xa = groupX, xb = groupX+barW+3;
    bars += `<rect x="${xa.toFixed(1)}" y="${(padT+plotH-ha).toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(ha,1).toFixed(1)}" rx="2" fill="${colorA}"><title>${esc(lab)}: ${money(va)}</title></rect>`;
    bars += `<rect x="${xb.toFixed(1)}" y="${(padT+plotH-hb).toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(hb,1).toFixed(1)}" rx="2" fill="${colorB}"><title>${esc(lab)}: ${money(vb)}</title></rect>`;
    labelsSvg += `<text x="${(groupX+barW).toFixed(1)}" y="${h-8}" font-size="9" fill="${COLORS.muted}" text-anchor="middle">${esc(lab)}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" class="chart-svg" preserveAspectRatio="xMidYMid meet">
    <line x1="${padL}" y1="${padT+plotH}" x2="${w-padR}" y2="${padT+plotH}" stroke="${COLORS.surface2}" stroke-width="1"/>
    ${bars}${labelsSvg}
  </svg>`;
}
function donutBlock(entries, opts){
  opts = opts || {};
  const total = sum(entries.map(e=>e[1]));
  const palette = [COLORS.gold, COLORS.red, COLORS.green, COLORS.blue, '#8A6D5C', '#B0895A'];
  if(total<=0 || entries.length===0){
    return `<div class="empty">Sin datos este mes todavía.</div>`;
  }
  let acc=0; const stops=[]; const legendRows=[];
  entries.slice(0,6).forEach((e,i)=>{
    const pct = e[1]/total*100;
    const color = palette[i%palette.length];
    stops.push(`${color} ${acc.toFixed(2)}% ${(acc+pct).toFixed(2)}%`);
    legendRows.push(`<div class="legend-row"><span class="legend-left"><span class="dot" style="background:${color}"></span>${esc(e[0])}</span><span>${opts.money ? money(e[1]) : e[1]} · ${pct.toFixed(0)}%</span></div>`);
    acc += pct;
  });
  return `<div class="donut-wrap">
    <div class="donut" style="background:conic-gradient(${stops.join(',')})">
      <div class="donut-center">${opts.money ? money(total) : total}</div>
    </div>
    <div class="legend" style="flex:1;min-width:160px;">${legendRows.join('')}</div>
  </div>`;
}

/* ============ DASHBOARD ============ */
function computeDashboard(){
  const today = todayStr();
  const thisMonth = monthKey(today);
  const todaySales = DB.sales.filter(s=>s.date===today);
  const monthSales = DB.sales.filter(s=>monthKey(s.date)===thisMonth);
  const monthAds = DB.ads.filter(a=>monthKey(a.date)===thisMonth);
  const monthExpenses = DB.expenses.filter(x=>monthKey(x.date)===thisMonth);
  const revToday = sum(todaySales.map(s=>s.total));
  const revMonth = sum(monthSales.map(s=>s.total));
  const profitMonth = sum(monthSales.map(s=>s.profit));
  const expensesMonth = sum(monthExpenses.map(x=>x.amount));
  const netProfitMonth = profitMonth - expensesMonth;
  const adSpendMonth = sum(monthAds.map(a=>a.amount));
  const adsRevenue = sum(monthSales.filter(s=>s.channel===CHANNELS[0]).map(s=>s.total));
  const roas = adSpendMonth>0 ? (adsRevenue/adSpendMonth) : null;
  const totalStock = DB.baseProducts.length>0 ? sum(DB.baseProducts.map(b=>b.stock)) : sum(DB.products.map(p=>p.stock));
  const pendingDeliveries = DB.sales.filter(s=>s.deliveryStatus && s.deliveryStatus!=='Entregado').length;
  const lowStock = DB.baseProducts.length>0 ? DB.baseProducts.filter(b=>b.stock<=b.minStock) : DB.products.filter(p=>p.stock<=p.minStock);
  return {revToday, revMonth, profitMonth, expensesMonth, netProfitMonth, adSpendMonth, roas, totalStock, pendingDeliveries, lowStock, monthSales};
}
function last14DaysSeries(){
  const days=[]; for(let i=13;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push(d.toISOString().slice(0,10)); }
  const labels = days.map(d=> d.slice(8,10)+'/'+d.slice(5,7) );
  const values = days.map(d=> sum(DB.sales.filter(s=>s.date===d).map(s=>s.total)) );
  return {labels, values};
}
function last6MonthsSeries(){
  const months=[]; const now=new Date();
  for(let i=5;i>=0;i--){ const d=new Date(now.getFullYear(), now.getMonth()-i, 1); months.push(d.toISOString().slice(0,7)); }
  const labels = months.map(m=> MONTH_NAMES[Number(m.split('-')[1])-1] );
  const profit = months.map(m=> sum(DB.sales.filter(s=>monthKey(s.date)===m).map(s=>s.profit)) );
  const adspend = months.map(m=> sum(DB.ads.filter(a=>monthKey(a.date)===m).map(a=>a.amount)) );
  return {labels, profit, adspend};
}
function productSalesShare(){
  const thisMonth = monthKey(todayStr());
  const monthSales = DB.sales.filter(s=>monthKey(s.date)===thisMonth);
  const map={};
  monthSales.forEach(s=>{ map[s.productName]=(map[s.productName]||0)+s.total; });
  return Object.entries(map).sort((a,b)=>b[1]-a[1]);
}
function stockRipenessHTML(){
  // Prioriza el stock físico real (bolsas base). Si todavía no lo configuró, usa el stock propio de cada presentación (compatibilidad).
  const items = DB.baseProducts.length>0
    ? DB.baseProducts.map(b=>({ name:b.name, stock:b.stock, minStock:b.minStock, unit:'bolsas' }))
    : DB.products.map(p=>({ name:p.name, stock:p.stock, minStock:p.minStock, unit:'u.' }));
  if(items.length===0) return `<div class="empty">Agrega tu stock físico en Configuración para ver el nivel aquí.</div>`;
  return items.map(it=>{
    const scaleMax = Math.max(it.stock, it.minStock*2, 10);
    const pct = Math.max(0, Math.min(100, (it.stock/scaleMax)*100));
    const minPct = Math.max(0, Math.min(100, (it.minStock/scaleMax)*100));
    const low = it.stock <= it.minStock;
    return `<div class="stock-row">
      <div class="stock-row-head"><b>${esc(it.name)}</b><span class="${low?'low':''}">${it.stock} ${it.unit}${low?' · bajo mínimo':''}</span></div>
      <div class="ripeness-track">
        <div class="ripeness-mask" style="width:${(100-pct).toFixed(1)}%"></div>
        <div class="ripeness-min" style="left:${minPct.toFixed(1)}%"></div>
      </div>
    </div>`;
  }).join('');
}

/* ============ MÓDULO DE LOTES (HELPERS Y LÓGICA MULTI-LOTE) ============ */
function getActiveLotes() {
  if (!DB.lotes) return { molido: null, grano: null };
  const molido = DB.lotes.find(l => l.active && (l.type === 'molido' || l.type === 'ambos')) || null;
  const grano = DB.lotes.find(l => l.active && (l.type === 'grano' || l.type === 'ambos')) || null;
  return { molido, grano };
}

function getActiveLote(type) {
  if (!DB.lotes || DB.lotes.length === 0) return null;
  if (type) {
    return DB.lotes.find(l => l.active && (l.type === type || l.type === 'ambos')) || DB.lotes.find(l => l.active) || null;
  }
  return DB.lotes.find(l => l.active) || null;
}

function getProductCost(product) {
  if (!product) return 0;
  const grindType = product.grindType || 'molido';
  const activeLote = getActiveLote(grindType);
  if (!activeLote || !product.weightGrams) {
    return parseFloat(product.cost) || 0;
  }
  const costPerGram = (parseFloat(activeLote.costPerKgRoasted) || 0) / 1000;
  const coffeeCost = costPerGram * (parseFloat(product.weightGrams) || 0);
  const packaging = parseFloat(product.packagingCost) || 0;
  return Math.round((coffeeCost + packaging) * 100) / 100;
}

async function addSale(){
  const productId = val('sf-product');
  const product = productById(productId);
  if(!product){ alert('Selecciona un producto válido.'); return; }
  const qty = num('sf-qty');
  if(qty<=0){ alert('La cantidad debe ser mayor a 0.'); return; }
  const base = product.baseProductId ? baseProductById(product.baseProductId) : null;
  const available = getAvailableUnits(product);
  if(available < qty){
    if(!confirm(`Stock insuficiente (disponible: ${available}). ¿Registrar la venta de todas formas?`)) return;
  }
  const price = num('sf-price');
  const delcost = num('sf-delcost');
  const delcharged = num('sf-delcharged');
  const total = qty * price;
  
  const unitCost = getProductCost(product);
  const costTotal = qty * unitCost;
  const profit = (total - costTotal) + (delcharged - delcost);
  const activeLote = getActiveLote(product.grindType || 'molido');

  const sale = {
    id: uid(), createdAt: Date.now(),
    date: val('sf-date') || todayStr(),
    productId, productName: product.name,
    qty, unitPrice: price, total,
    unitCostUsed: unitCost,
    loteIdUsed: activeLote ? activeLote.id : null,
    channel: val('sf-channel'),
    customer: val('sf-customer'),
    paymentStatus: val('sf-payment'),
    deliveryStatus: val('sf-delivery'),
    deliveryCost: delcost, deliveryCharged: delcharged,
    zone: val('sf-zone'),
    profit
  };

  DB.sales.push(sale);

  let mv;
  if(base){
    const bagsConsumed = qty * (product.unitsPerSale||1);
    base.stock -= bagsConsumed;
    mv = { id: uid(), date: sale.date, productId: base.id, productName: base.name, type:'salida', qty: bagsConsumed, reason:'Venta: ' + product.name + ' x' + qty };
  } else {
    product.stock -= qty;
    mv = { id: uid(), date: sale.date, productId, productName: product.name, type:'salida', qty, reason:'Venta' };
  }
  DB.movements.push(mv);
  saveDB();
  renderVentas();
  await syncRemote('addSale', sale);
  if(base) await syncRemote('updateBaseProduct', base);
  else await syncRemote('updateProduct', product);
  await syncRemote('addMovement', mv);
}

async function deleteSale(id){
  if(!confirm('¿Eliminar esta venta? El stock se devolverá.')) return;
  const sale = DB.sales.find(s=>s.id===id);
  let product = null, base = null, mv = null;
  if(sale){
    product = productById(sale.productId);
    if(product){
      base = product.baseProductId ? baseProductById(product.baseProductId) : null;
      if(base){
        const bagsBack = sale.qty * (product.unitsPerSale||1);
        base.stock += bagsBack;
        mv = { id: uid(), date: todayStr(), productId: base.id, productName: base.name, type:'entrada', qty: bagsBack, reason:'Reversión de venta eliminada: ' + product.name };
      } else {
        product.stock += sale.qty;
        mv = { id: uid(), date: todayStr(), productId: sale.productId, productName: sale.productName, type:'entrada', qty: sale.qty, reason:'Reversión de venta eliminada' };
      }
      DB.movements.push(mv);
    }
  }
  DB.sales = DB.sales.filter(s=>s.id!==id);
  saveDB();
  renderVentas();
  await syncRemote('deleteSale', {id});
  if(base) await syncRemote('updateBaseProduct', base);
  else if(product) await syncRemote('updateProduct', product);
  if(mv) await syncRemote('addMovement', mv);
}

async function addMovement(){
  const raw = val('mv-product');
  if(!raw){ alert('Selecciona un producto.'); return; }
  const [kind, id] = raw.split(':');
  const qty = num('mv-qty');
  if(qty<=0){ alert('La cantidad debe ser mayor a 0.'); return; }
  const type = val('mv-type');
  const reason = val('mv-reason');
  let mv;
  if(kind==='base'){
    const base = baseProductById(id);
    if(!base){ alert('Producto base no encontrado.'); return; }
    base.stock += (type==='entrada' ? qty : -qty);
    mv = { id: uid(), date: todayStr(), productId: base.id, productName: base.name, type, qty, reason };
    DB.movements.push(mv);
    saveDB();
    renderStock();
    await syncRemote('addMovement', mv);
    await syncRemote('updateBaseProduct', base);
  } else {
    const product = productById(id);
    if(!product){ alert('Producto no encontrado.'); return; }
    product.stock += (type==='entrada' ? qty : -qty);
    mv = { id: uid(), date: todayStr(), productId: product.id, productName: product.name, type, qty, reason };
    DB.movements.push(mv);
    saveDB();
    renderStock();
    await syncRemote('addMovement', mv);
    await syncRemote('updateProduct', product);
  }
}

/* ============ ACCIONES DE LOTES ============ */
async function addLote(){
  const name = val('lot-name').trim() || ('Lote ' + ((DB.lotes ? DB.lotes.length : 0) + 1));
  const producer = val('lot-producer').trim();
  const variety = val('lot-variety').trim();
  const origin = val('lot-origin').trim();
  const cupScore = num('lot-score');
  const type = val('lot-type') || 'ambos';
  
  const greenKg = num('lot-green-kg');
  const greenCostPerKg = num('lot-green-cost');
  const freightCost = num('lot-freight-cost');
  const roastedKg = num('lot-roasted-kg');
  const roastCost = num('lot-roast-cost');

  if(greenKg <= 0 || roastedKg <= 0) {
    alert('Ingresa cantidades válidas para los kilos de café verde y tostado.');
    return;
  }

  const greenTotalCost = greenKg * greenCostPerKg;
  const totalLotCost = greenTotalCost + roastCost + freightCost;
  const costPerKgRoasted = Math.round((totalLotCost / roastedKg) * 100) / 100;
  const yieldPct = (roastedKg / greenKg) * 100;

  if(!DB.lotes) DB.lotes = [];

  // Desactivar lotes previos del mismo tipo al activar este
  DB.lotes.forEach(l => {
    if(l.active){
      if(type === 'ambos' || l.type === 'ambos' || l.type === type) {
        l.active = false;
      }
    }
  });

  const lote = {
    id: uid(), name, producer, variety, origin, cupScore, type,
    date: todayStr(), greenKg, greenCostPerKg, freightCost,
    roastedKg, roastCost, totalLotCost, costPerKgRoasted, yieldPct,
    active: true
  };

  DB.lotes.push(lote);
  saveDB();
  renderConfig();
  await syncRemote('addLote', lote);
}

async function toggleLoteActive(id){
  if(!DB.lotes) return;
  const target = DB.lotes.find(l => l.id === id);
  if(!target) return;

  const willBeActive = !target.active;
  const changed = [];

  DB.lotes.forEach(l => {
    if(willBeActive) {
      if(l.id === id) {
        if(!l.active){ l.active = true; changed.push(l); }
      } else if(target.type === 'ambos' || l.type === 'ambos' || l.type === target.type) {
        if(l.active){ l.active = false; changed.push(l); }
      }
    } else {
      if(l.id === id){ l.active = false; changed.push(l); }
    }
  });

  saveDB();
  renderConfig();
  for(const l of changed){ await syncRemote('updateLote', l); }
}

async function deleteLote(id){
  if(!confirm('¿Eliminar este lote? Las ventas pasadas conservarán sus datos registrados.')) return;
  DB.lotes = DB.lotes.filter(l => l.id !== id);
  saveDB();
  renderConfig();
  await syncRemote('deleteLote', {id});
}

async function saveEditedLote(id){
  const l = DB.lotes.find(item => item.id === id);

  l.name = val('el-name').trim() || l.name;
  l.producer = val('el-producer').trim();
  l.variety = val('el-variety').trim();
  l.origin = val('el-origin').trim();
  l.cupScore = num('el-score');
  l.type = val('el-type');
  l.greenKg = num('el-green-kg');
  l.greenCostPerKg = num('el-green-cost');
  l.freightCost = num('el-freight-cost');
  l.roastedKg = num('el-roasted-kg');
  l.roastCost = num('el-roast-cost');

  const greenTotalCost = l.greenKg * l.greenCostPerKg;
  l.totalLotCost = greenTotalCost + l.roastCost + l.freightCost;
  l.costPerKgRoasted = l.roastedKg > 0 ? Math.round((l.totalLotCost / l.roastedKg) * 100) / 100 : 0;
  l.yieldPct = l.greenKg > 0 ? (l.roastedKg / l.greenKg) * 100 : 0;

  saveDB();
  closeModal();
  renderConfig();
  await syncRemote('updateLote', l);

/* ============ RESPALDO Y RESET ============ */
function exportBackup(){
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'casa-vieja-backup-' + todayStr() + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function importBackup(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed || !Array.isArray(parsed.products) || !Array.isArray(parsed.sales)){
        alert('El archivo no parece un backup válido de Casa Vieja.');
        return;
      }
      if(confirm('Esto reemplazará todos tus datos actuales por los del backup. ¿Continuar?')){
        DB = Object.assign(defaultDB(), parsed);
        saveDB();
        renderView(currentView);
        alert('Backup restaurado correctamente.');
      }
    }catch(err){
      alert('No se pudo leer el archivo: ' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function resetAll(){
  if(!confirm('¿Seguro que quieres borrar TODOS los datos (productos, lotes, ventas, ads, movimientos)?')) return;
  if(!confirm('Última confirmación: esta acción no se puede deshacer. ¿Borrar todo?')) return;
  DB = defaultDB();
  saveDB();
  renderView('config');
}

// Pantallas seguras para refrescar automáticamente sin interrumpir la escritura de formularios
const SAFE_REFRESH_VIEWS = ['dashboard', 'delivery', 'stock', 'ads', 'egresos'];

async function tryLiveRefresh(){
  if(!isConnected()) return;
  if(document.visibilityState !== 'visible') return;

  // Si estás escribiendo en una caja de texto o campo, no refrescamos para no borrar lo que escribes
  const isTyping = document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'SELECT');
  if(isTyping) return;

  // Si estás en una vista segura o no estás interactuando, sincroniza
  if(SAFE_REFRESH_VIEWS.includes(currentView)){
    const ok = await refreshFromRemote();
    if(ok && SAFE_REFRESH_VIEWS.includes(currentView)) {
      renderView(currentView);
    }
  }
}

// ⏱️ Revisa automáticamente cada 8 segundos si tu compañera hizo algún cambio
setInterval(tryLiveRefresh, 8000);

// 📱 Si minimizas el navegador en el teléfono y lo vuelves a abrir, sincroniza al instante
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') tryLiveRefresh(); });
window.addEventListener('focus', tryLiveRefresh);
